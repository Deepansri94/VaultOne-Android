<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>VaultOne 🔐</title>
<link rel="stylesheet" href="shared.css">
<style>
body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
.launcher { width: min(480px, 100vw); padding: 32px 20px 40px; text-align: center; }
.logo { font-size: 52px; margin-bottom: 8px; }
.launcher h1 { margin: 0 0 6px; font-size: 28px; }
.launcher .sub { color: var(--muted); font-size: 14px; margin-bottom: 36px; }
.apps { display: grid; gap: 14px; }
.app-btn {
  display: flex; align-items: center; gap: 16px;
  padding: 18px 20px; border-radius: 22px;
  border: 1px solid #ffffff14;
  background: linear-gradient(145deg, #0e1a2c, #0a1322);
  color: var(--text); text-decoration: none;
  transition: border-color .15s, transform .12s;
}
.app-btn:hover { border-color: var(--purple); transform: translateY(-2px); }
.app-icon { width: 52px; height: 52px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 24px; flex: 0 0 auto; }
.app-icon.purple { background: #8b5cf62b; }
.app-icon.cyan { background: #38bdf82b; }
.app-icon.gold { background: #f5c5422b; }
.app-info { text-align: left; }
.app-name { font-weight: 800; font-size: 16px; }
.app-desc { color: var(--muted); font-size: 12px; margin-top: 2px; }
.footer { margin-top: 32px; color: var(--muted); font-size: 11px; }
.launcher-header { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 20px; }
</style>
</head>
<body data-no-act-log>
<div class="launcher">
  <div class="launcher-header">
    <button class="iconbtn" id="settingsBtn" title="Settings">⚙️</button>
  </div>
  <div class="logo">🔐</div>
  <h1>VaultOne</h1>
  <p class="sub">Offline-first · All data stays on your device</p>
  <div class="apps">
    <a class="app-btn" href="iVault.html">
      <div class="app-icon purple">💰</div>
      <div class="app-info">
        <div class="app-name">iVault</div>
        <div class="app-desc">Personal Finance &amp; Wealth Management</div>
      </div>
    </a>
    <a class="app-btn" href="FamilyVault.html">
      <div class="app-icon cyan">📁</div>
      <div class="app-info">
        <div class="app-name">FamilyVault</div>
        <div class="app-desc">Documents, People &amp; Households</div>
      </div>
    </a>
    <a class="app-btn" href="PasswordVault.html">
      <div class="app-icon gold">🔑</div>
      <div class="app-info">
        <div class="app-name">PasswordVault</div>
        <div class="app-desc">Encrypted local password manager</div>
      </div>
    </a>
  </div>
  <div class="footer">VaultOne v2.0 · No server · No cloud</div>
</div>

<!-- Quick Add Expense FAB -->
<button id="quickExpFab" title="Quick Add Expense" style="
  position:fixed;bottom:96px;right:18px;z-index:35;
  width:52px;height:52px;border-radius:50%;
  background:linear-gradient(135deg,#fb7185,#7c3aed);
  border:none;color:#fff;font-size:26px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 24px #0008;cursor:pointer;">💸</button>

<!-- Notes FAB -->
<button class="notes-fab" id="notesFab" title="Notes" style="bottom:158px">📝</button>
<div id="notesPanel" class="notes-panel">
  <div class="notes-panel-head"><h3>📝 Notes</h3><button class="iconbtn" id="notesPanelClose">✕</button></div>
  <div class="actions" style="margin-bottom:12px"><button class="btn primary" id="notesAddBtn">+ Add Note</button></div>
  <form id="notesForm" style="margin-bottom:14px">
    <div id="notesFormWrap" style="display:none"><div id="notesFormArea"></div></div>
  </form>
  <div id="notesList"></div>
</div>

<!-- Modal (needed for Quick Add Expense) -->
<div id="modal" class="modal">
  <div class="sheet">
    <div class="modal-head"><h3 id="modalTitle"></h3><button class="iconbtn" id="modalClose">✕</button></div>
    <div id="modalBody"></div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="shared.js"></script>
<script>
'use strict';
/* ===== Index page: open iVaultDB so shared.js Notes IIFE can use it ===== */
(async function () {
  const DB_NAME = 'iVaultDB';
  const STORES = ['meta','income','expenses','budgets','investments','loans','reminders','activity','notes'];
  await openDB(DB_NAME, 1, STORES);
})();

/* ===== Quick Add Expense FAB ===== */
(function(){
  const CATS = {
    'Household':          ['Rent','Electricity','Water / Maintenance','Internet / Cable','Gas / LPG'],
    'Transport':          ['Fuel / Petrol','Auto / Cab / Bus','Vehicle EMI','Parking / Toll'],
    'Food & Personal':    ['Groceries','Vegetables & Fruits','Milk & Dairy','Eating Out / Sweets','Personal Care'],
    'Health & Emergency': ['Medicine / Pharmacy','Doctor / Hospital','Emergency Fund'],
    'Loans & Financial':  ['Home Loan EMI','Car / Bike Loan','Personal Loan','Credit Card'],
    'Family / Religious / Social': ['Festivals / Pooja','Gifts / Events','Donations','School / Tuition'],
    'Savings & Investments': ['SIP / Mutual Fund','PPF / RD','Insurance Premium','FD'],
    'Other':              ['Miscellaneous','Subscriptions','Clothing','Home Maintenance']
  };
  const catNames = Object.keys(CATS);

  function subcatOpts(cat) {
    return '<option value="">-- select --</option>' +
      (CATS[cat] || []).map(s => `<option value="${s}">${s}</option>`).join('');
  }

  document.getElementById('quickExpFab').onclick = () => {
    const defaultCat = catNames[0];
    openModal('💸 Quick Add Expense', `<form class="grid">
      <label>Category
        <select name="category" id="qeCat">${catNames.map(c=>`<option>${c}</option>`).join('')}</select>
      </label>
      <label>Sub-category
        <select name="subcategory" id="qeSubcat">${subcatOpts(defaultCat)}</select>
      </label>
      <label>Amount <span class="req-star">*</span><input name="amount" type="number" min="0" step="0.01" required></label>
      <label>Date <span class="req-star">*</span><input name="date" type="date" required value="${new Date().toISOString().slice(0,10)}"></label>
      <label>Note<input name="note" placeholder="Optional note"></label>
      <div class="actions" style="grid-column:1/-1"><button type="submit" class="btn primary">Save Expense</button></div>
    </form>`, async fd => {
      const amount = Number(fd.get('amount'));
      if (amount <= 0) { toast('Enter a valid amount', true); return; }
      try {
        await putOne('expenses', {
          id: uid(), category: fd.get('category'), subcategory: fd.get('subcategory')||'',
          amount, date: fd.get('date'), note: fd.get('note')||'',
          createdAt: new Date().toISOString()
        });
        closeModal(); toast('Expense saved to iVault ✓');
      } catch(e) { toast('Could not save: ' + e.message, true); }
    });
    // Wire category → subcategory after modal renders
    setTimeout(() => {
      const catSel = document.getElementById('qeCat');
      const subSel = document.getElementById('qeSubcat');
      if (catSel && subSel) {
        catSel.addEventListener('change', () => { subSel.innerHTML = subcatOpts(catSel.value); });
      }
    }, 0);
  };
})();
</script>
</body>
</html>
