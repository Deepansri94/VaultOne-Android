<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>VaultOne 🔐</title>
<link rel="stylesheet" href="shared.css">
<style>
body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
.launcher { width: min(480px, 100vw); padding: 32px 20px 40px; text-align: center; }
.logo { font-size: 52px; margin-bottom: 8px; }
.launcher h1 { margin: 0 0 6px; font-size: 28px; }
.launcher .sub { color: var(--muted); font-size: 14px; margin-bottom: 36px; }
.apps { display: grid; gap: 14px; }
.app-btn {
  display: flex; align-items: center; gap: 16px;
  padding: 18px 20px; border-radius: 22px;
  border: 1px solid #ffffff14;
  background: linear-gradient(145deg, #0e1a2c, #0a1322);
  color: var(--text); text-decoration: none;
  transition: border-color .15s, transform .12s;
}
.app-btn:hover { border-color: var(--purple); transform: translateY(-2px); }
.app-icon { width: 52px; height: 52px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 24px; flex: 0 0 auto; }
.app-icon.purple { background: #8b5cf62b; }
.app-icon.cyan { background: #38bdf82b; }
.app-icon.gold { background: #f5c5422b; }
.app-info { text-align: left; }
.app-name { font-weight: 800; font-size: 16px; }
.app-desc { color: var(--muted); font-size: 12px; margin-top: 2px; }
.footer { margin-top: 32px; color: var(--muted); font-size: 11px; }
.launcher-header { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 20px; }
</style>
</head>
<body data-no-act-log>
<div class="launcher">
  <div class="launcher-header">
    <button class="iconbtn" id="settingsBtn" title="Settings">⚙️</button>
  </div>
  <div class="logo">🔐</div>
  <h1>VaultOne</h1>
  <p class="sub">Offline-first · All data stays on your device</p>
  <div class="apps">
    <a class="app-btn" href="iVault.html">
      <div class="app-icon purple">💰</div>
      <div class="app-info">
        <div class="app-name">iVault</div>
        <div class="app-desc">Personal Finance &amp; Wealth Management</div>
      </div>
    </a>
    <a class="app-btn" href="FamilyVault.html">
      <div class="app-icon cyan">📁</div>
      <div class="app-info">
        <div class="app-name">FamilyVault</div>
        <div class="app-desc">Documents, People &amp; Households</div>
      </div>
    </a>
    <a class="app-btn" href="PasswordVault.html">
      <div class="app-icon gold">🔑</div>
      <div class="app-info">
        <div class="app-name">PasswordVault</div>
        <div class="app-desc">Encrypted local password manager</div>
      </div>
    </a>
  </div>
  <div class="footer">
    VaultOne <span id="appVersionLabel">...</span> · No server · No cloud
    <button id="releaseNotesBtn" title="What's new" style="
      background:none;border:none;color:var(--purple);font-size:11px;
      cursor:pointer;padding:0 4px;text-decoration:underline;vertical-align:middle">What's new</button>
  </div>
</div>

<!-- Release Notes Modal -->
<div id="releaseNotesModal" class="modal">
  <div class="sheet" style="border-radius:26px 26px 0 0">
    <div class="modal-head">
      <h3>🚀 What's New</h3>
      <button class="iconbtn" id="releaseNotesClose">✕</button>
    </div>
    <div id="releaseNotesBody"></div>
  </div>
</div>

<!-- Quick Add Expense FAB -->
<button id="quickExpFab" title="Quick Add Expense" style="
  position:fixed;bottom:96px;right:18px;z-index:35;
  width:52px;height:52px;border-radius:50%;
  background:linear-gradient(135deg,#fb7185,#7c3aed);
  border:none;color:#fff;font-size:26px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 24px #0008;cursor:pointer;">💸</button>

<!-- Notes FAB -->
<button class="notes-fab" id="notesFab" title="Notes" style="bottom:158px">📝</button>
<div id="notesPanel" class="notes-panel">
  <div class="notes-panel-head"><h3>📝 Notes</h3><button class="iconbtn" id="notesPanelClose">✕</button></div>
  <div class="actions" style="margin-bottom:12px"><button class="btn primary" id="notesAddBtn">+ Add Note</button></div>
  <form id="notesForm" style="margin-bottom:14px">
    <div id="notesFormWrap" style="display:none"><div id="notesFormArea"></div></div>
  </form>
  <div id="notesList"></div>
</div>

<!-- Modal (needed for Quick Add Expense) -->
<div id="modal" class="modal">
  <div class="sheet">
    <div class="modal-head"><h3 id="modalTitle"></h3><button class="iconbtn" id="modalClose">✕</button></div>
    <div id="modalBody"></div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="shared.js"></script>
<script>
'use strict';

/* ===== App version & Release Notes (VO-14) ===== */
const GITHUB_RELEASES_API = 'https://api.github.com/repos/Deepansri94/VaultOne-Android/releases';
const SEEN_KEY = 'vaultone_seen_version';
const CACHED_RELEASES_KEY = 'vaultone_releases_cache';

(function () {

  /* ── Helpers ── */
  function fmtDate(iso) {
    if (!iso) return '';
    try { return new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }); }
    catch { return iso.slice(0, 10); }
  }

  function parseVersion(name) {
    // Release name is e.g. "VaultOne 2.82" — extract the number part
    const m = String(name || '').match(/([\d.]+)/);
    return m ? m[1] : name;
  }

  /* ── Render modal from releases array ── */
  function renderReleaseNotes(releases, latestVersion) {
    const body = document.getElementById('releaseNotesBody');
    if (!body) return;
    if (!releases.length) {
      body.innerHTML = '<div class="empty">No release information available.</div>';
    } else {
      body.innerHTML = releases.map((r, i) => {
        const ver = parseVersion(r.name || r.tag_name);
        const date = fmtDate(r.published_at);
        const isCurrent = i === 0;
        const lines = (r.body || '').split('\n')
          .map(l => l.replace(/^[-*]\s*/, '').trim())
          .filter(l => l.length > 0)
          .slice(0, 10);
        return `
          <div style="margin-bottom:18px">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap">
              <span style="font-weight:800;font-size:15px;color:#c4b5fd">${esc(r.name || ver)}</span>
              <span style="font-size:11px;color:var(--muted)">${esc(date)}</span>
              ${isCurrent ? '<span style="background:#7c3aed22;border:1px solid #7c3aed55;color:#c4b5fd;font-size:10px;padding:2px 8px;border-radius:999px">Latest</span>' : ''}
            </div>
            ${lines.length
              ? `<ul style="margin:0;padding-left:18px;display:grid;gap:5px">${lines.map(l => `<li style="font-size:13px;color:#b7c2d4">${esc(l)}</li>`).join('')}</ul>`
              : '<p style="font-size:13px;color:var(--muted);margin:0">Automated build release.</p>'}
          </div>`;
      }).join('<hr style="border-color:#ffffff10;margin:14px 0">');
    }
    body.innerHTML += '<div class="actions" style="margin-top:4px"><button class="btn primary" id="rnCloseBtn">Got it ✔</button></div>';
    document.getElementById('rnCloseBtn')?.addEventListener('click', closeReleaseNotes);
  }

  function openReleaseNotes(releases, latestVersion) {
    renderReleaseNotes(releases, latestVersion);
    document.getElementById('releaseNotesModal').classList.add('open');
    if (latestVersion) localStorage.setItem(SEEN_KEY, latestVersion);
  }

  function closeReleaseNotes() {
    document.getElementById('releaseNotesModal').classList.remove('open');
  }

  /* ── Fetch releases from GitHub API ── */
  async function fetchReleases() {
    // Try cache first (valid for 1 hour)
    try {
      const cached = JSON.parse(localStorage.getItem(CACHED_RELEASES_KEY) || 'null');
      if (cached && cached.ts && (Date.now() - cached.ts) < 3600000) return cached.data;
    } catch {}
    try {
      const res = await fetch(GITHUB_RELEASES_API + '?per_page=5');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      localStorage.setItem(CACHED_RELEASES_KEY, JSON.stringify({ ts: Date.now(), data }));
      return data;
    } catch {
      // Offline or rate-limited — return cached even if stale
      try { return JSON.parse(localStorage.getItem(CACHED_RELEASES_KEY) || 'null')?.data || []; } catch { return []; }
    }
  }

  /* ── Update footer version label ── */
  function updateVersionLabel(releases) {
    const vLabel = document.getElementById('appVersionLabel');
    if (!vLabel) return;
    if (releases && releases.length) {
      vLabel.textContent = releases[0].name || ('v' + parseVersion(releases[0].tag_name));
    }
  }

  /* ── Boot ── */
  document.addEventListener('DOMContentLoaded', async () => {
    const releases = await fetchReleases();
    const latestVersion = releases.length ? (releases[0].name || releases[0].tag_name) : null;

    updateVersionLabel(releases);

    // Auto-show if user hasn't seen this version yet
    const seen = localStorage.getItem(SEEN_KEY);
    if (latestVersion && seen !== latestVersion) {
      setTimeout(() => openReleaseNotes(releases, latestVersion), 600);
    }

    // Wire "What's new" button — fetch fresh on click
    document.getElementById('releaseNotesBtn')?.addEventListener('click', async () => {
      const fresh = await fetchReleases();
      openReleaseNotes(fresh, fresh.length ? (fresh[0].name || fresh[0].tag_name) : null);
    });
  });

  document.getElementById('releaseNotesClose')?.addEventListener('click', closeReleaseNotes);
  document.getElementById('releaseNotesModal')?.addEventListener('click', e => {
    if (e.target.id === 'releaseNotesModal') closeReleaseNotes();
  });

})();

/* ===== Index page: open iVaultDB so shared.js Notes IIFE can use it ===== */
(async function () {
  const DB_NAME = 'iVaultDB';
  const STORES = ['meta','income','expenses','budgets','investments','loans','reminders','activity','notes','cashWallets'];
  await openDB(DB_NAME, 2, STORES);
})();

/* ===== Quick Add Expense FAB ===== */
(function(){
  const CATS = {
    'Household':          ['Rent','Electricity','Water / Maintenance','Internet / Cable','Gas / LPG'],
    'Transport':          ['Fuel / Petrol','Auto / Cab / Bus','Vehicle EMI','Parking / Toll'],
    'Food & Personal':    ['Groceries','Vegetables & Fruits','Milk & Dairy','Eating Out / Sweets','Personal Care'],
    'Health & Emergency': ['Medicine / Pharmacy','Doctor / Hospital','Emergency Fund'],
    'Loans & Financial':  ['Home Loan EMI','Car / Bike Loan','Personal Loan','Credit Card'],
    'Family / Religious / Social': ['Festivals / Pooja','Gifts / Events','Donations','School / Tuition'],
    'Savings & Investments': ['SIP / Mutual Fund','PPF / RD','Insurance Premium','FD'],
    'Other':              ['Miscellaneous','Subscriptions','Clothing','Home Maintenance']
  };
  const catNames = Object.keys(CATS);

  function subcatOpts(cat) {
    return '<option value="">-- select --</option>' +
      (CATS[cat] || []).map(s => `<option value="${s}">${s}</option>`).join('');
  }

  document.getElementById('quickExpFab').onclick = () => {
    const defaultCat = catNames[0];
    openModal('💸 Quick Add Expense', `<form class="grid">
      <label>Category
        <select name="category" id="qeCat">${catNames.map(c=>`<option>${c}</option>`).join('')}</select>
      </label>
      <label>Sub-category
        <select name="subcategory" id="qeSubcat">${subcatOpts(defaultCat)}</select>
      </label>
      <label>Amount <span class="req-star">*</span><input name="amount" type="number" min="0" step="0.01" required></label>
      <label>Date <span class="req-star">*</span><input name="date" type="date" required value="${new Date().toISOString().slice(0,10)}"></label>
      <label>Note<input name="note" placeholder="Optional note"></label>
      <div class="actions" style="grid-column:1/-1"><button type="submit" class="btn primary">Save Expense</button></div>
    </form>`, async fd => {
      const amount = Number(fd.get('amount'));
      if (amount <= 0) { toast('Enter a valid amount', true); return; }
      try {
        await putOne('expenses', {
          id: uid(), category: fd.get('category'), subcategory: fd.get('subcategory')||'',
          amount, date: fd.get('date'), note: fd.get('note')||'',
          createdAt: new Date().toISOString()
        });
        closeModal(); toast('Expense saved to iVault ✓');
      } catch(e) { toast('Could not save: ' + e.message, true); }
    });
    // Wire category → subcategory after modal renders
    setTimeout(() => {
      const catSel = document.getElementById('qeCat');
      const subSel = document.getElementById('qeSubcat');
      if (catSel && subSel) {
        catSel.addEventListener('change', () => { subSel.innerHTML = subcatOpts(catSel.value); });
      }
    }, 0);
  };
})();
</script>
</body>
</html>
