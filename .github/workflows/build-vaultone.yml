name: Build VaultOne APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build VaultOne APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout VaultOne
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Install Android SDK
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      # 5. Show repository structure
      - name: Inspect repository
        run: |
          echo "Repository root:"
          pwd

          echo ""
          echo "Root contents:"
          ls -la

          echo ""
          echo "VaultOne-Android contents:"
          ls -la VaultOne-Android

          echo ""
          echo "Android project files:"
          find VaultOne-Android -maxdepth 3 -type f \
            \( -name "build.gradle" \
            -o -name "settings.gradle" \
            -o -name "gradle.properties" \
            -o -name "gradle-wrapper.properties" \) \
            -print

      # 6. Setup Gradle 9.5
      - name: Setup Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      # 7. Check Gradle
      - name: Check Gradle
        working-directory: VaultOne-Android
        run: |
          gradle --version

      # 8. Validate Android project
      - name: Validate Android project
        working-directory: VaultOne-Android
        run: |
          gradle tasks --stacktrace

      # 9. Clean
      - name: Clean project
        working-directory: VaultOne-Android
        run: |
          gradle clean --stacktrace

      # 10. Build APK
      - name: Build VaultOne Debug APK
        working-directory: VaultOne-Android
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      # 11. Find APK
      - name: Locate APK
        run: |
          echo "Generated APK files:"
          find VaultOne-Android -type f -name "*.apk" -print

      # 12. Prepare APK
      - name: Prepare APK
        run: |
          mkdir -p release

          APK=$(find VaultOne-Android/app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          cp "$APK" release/VaultOne-debug.apk

          echo ""
          echo "APK successfully prepared:"
          ls -lh release/VaultOne-debug.apk

      # 13. Upload APK
      - name: Upload VaultOne APK
        uses: actions/upload-artifact@v4
        with:
          name: VaultOne-APK
          path: release/VaultOne-debug.apk
          if-no-files-found: error

      # 14. Upload build reports
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VaultOne-Build-Reports
          path: VaultOne-Android/**/build/reports/**
          if-no-files-found: ignore
