name: Build VaultOne APK

on:
  workflow_dispatch:
  push:
    paths:
      - "VaultOne-Android-Project.zip"
      - ".github/workflows/build-vaultone.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5"

      - name: Extract VaultOne Android project
        run: |
          rm -rf build-project
          mkdir build-project
          unzip -q VaultOne-Android-Project.zip -d build-project
          test -f build-project/VaultOne-Android/settings.gradle
          test -f build-project/VaultOne-Android/app/src/main/assets/index.html

      - name: Build debug APK
        working-directory: build-project/VaultOne-Android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VaultOne-debug-APK
          path: build-project/VaultOne-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
