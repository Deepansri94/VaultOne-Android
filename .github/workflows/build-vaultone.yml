name: Build VaultOne APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build VaultOne APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout VaultOne
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Install Android SDK components
      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      # 5. Inspect repository
      - name: Inspect repository
        shell: bash
        run: |
          echo "========================================"
          echo "VAULTONE REPOSITORY INSPECTION"
          echo "========================================"

          echo ""
          echo "Current directory:"
          pwd

          echo ""
          echo "Root contents:"
          ls -la

          echo ""
          echo "Directories:"
          find . -maxdepth 3 -type d -print | sort

          echo ""
          echo "Gradle files:"
          find . -maxdepth 6 -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "gradlew" \
            -o -name "gradle-wrapper.properties" \) \
            -print | sort

          echo ""
          echo "APK/project detection complete."

      # 6. Detect Android project automatically
      - name: Detect Android project
        shell: bash
        run: |
          echo "Searching for Android Gradle project..."

          SETTINGS_FILE=$(find . -maxdepth 6 -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo ""
            echo "ERROR: No settings.gradle or settings.gradle.kts found."
            echo ""
            echo "This repository does not currently contain a recognizable"
            echo "Android/Gradle project."
            echo ""
            echo "Repository contents:"
            find . -maxdepth 4 -type f -print | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          if [ "$PROJECT_DIR" = "." ]; then
            PROJECT_DIR="."
          fi

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 7. Show detected project
      - name: Verify detected project
        shell: bash
        run: |
          echo "========================================"
          echo "DETECTED PROJECT"
          echo "========================================"

          echo "PROJECT_DIR=$PROJECT_DIR"

          echo ""
          echo "Project contents:"
          ls -la "$PROJECT_DIR"

          echo ""
          echo "Gradle files:"
          find "$PROJECT_DIR" -maxdepth 3 -type f \
            \( -name "settings.gradle*" \
            -o -name "build.gradle*" \
            -o -name "gradlew" \
            -o -name "gradle-wrapper.properties" \) \
            -print

      # 8. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # 9. Check whether Gradle Wrapper exists
      - name: Check Gradle Wrapper
        shell: bash
        run: |
          if [ -f "$PROJECT_DIR/gradlew" ]; then
            echo "Gradle Wrapper found."
            chmod +x "$PROJECT_DIR/gradlew"
            "$PROJECT_DIR/gradlew" --version
          else
            echo ""
            echo "WARNING: Gradle Wrapper not found."
            echo "Using GitHub Actions Gradle installation."
          fi

      # 10. Build Android project
      - name: Build VaultOne APK
        shell: bash
        run: |
          if [ -f "$PROJECT_DIR/gradlew" ]; then

            chmod +x "$PROJECT_DIR/gradlew"

            "$PROJECT_DIR/gradlew" \
              assembleDebug \
              --stacktrace \
              --no-daemon

          else

            echo "Gradle Wrapper unavailable."
            echo "Installing Gradle through setup-gradle..."

            gradle assembleDebug \
              --stacktrace \
              --no-daemon

          fi

      # 11. Locate APK
      - name: Locate APK
        shell: bash
        run: |
          echo "Searching for APK..."

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      # 12. Prepare APK
      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p release

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo ""
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          cp "$APK" release/VaultOne-debug.apk

          echo ""
          echo "Final APK:"
          ls -lh release/VaultOne-debug.apk

      # 13. Upload APK
      - name: Upload VaultOne APK
        uses: actions/upload-artifact@v4
        with:
          name: VaultOne-APK
          path: release/VaultOne-debug.apk
          if-no-files-found: error

      # 14. Upload build reports
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VaultOne-Build-Reports
          path: |
            **/build/reports/**
          if-no-files-found: ignore
