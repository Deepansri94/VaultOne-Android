name: Build VaultOne APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build VaultOne APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: VaultOne-Android

    steps:

      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout VaultOne
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Setup Java 17
      # ---------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ---------------------------------------------------------
      # 3. Setup Android SDK
      # ---------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ---------------------------------------------------------
      # 4. Install required Android SDK components
      # ---------------------------------------------------------
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      # ---------------------------------------------------------
      # 5. Verify VaultOne Android project
      # ---------------------------------------------------------
      - name: Verify Android project
        run: |
          echo "Working directory:"
          pwd

          echo ""
          echo "Project files:"
          ls -la

          echo ""
          echo "App directory:"
          ls -la app

          echo ""
          echo "Gradle files:"
          find . -maxdepth 3 \
            \( -name "*.gradle" -o -name "*.gradle.kts" -o -name "gradle-wrapper.properties" \) \
            -print

      # ---------------------------------------------------------
      # 6. Setup Gradle 9.5
      # ---------------------------------------------------------
      - name: Setup Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      # ---------------------------------------------------------
      # 7. Verify Gradle
      # ---------------------------------------------------------
      - name: Check Gradle
        run: |
          gradle --version

      # ---------------------------------------------------------
      # 8. Validate Android project
      # ---------------------------------------------------------
      - name: Validate Android project
        run: |
          gradle tasks --stacktrace

      # ---------------------------------------------------------
      # 9. Clean previous build
      # ---------------------------------------------------------
      - name: Clean project
        run: |
          gradle clean --stacktrace

      # ---------------------------------------------------------
      # 10. Build Debug APK
      # ---------------------------------------------------------
      - name: Build VaultOne Debug APK
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      # ---------------------------------------------------------
      # 11. Locate generated APK
      # ---------------------------------------------------------
      - name: Locate APK
        run: |
          echo "Searching for generated APK files..."
          find . -type f -name "*.apk" -print

      # ---------------------------------------------------------
      # 12. Rename APK for easy identification
      # ---------------------------------------------------------
      - name: Prepare APK
        run: |
          mkdir -p release

          APK=$(find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          cp "$APK" release/VaultOne-debug.apk

          echo "APK prepared:"
          ls -lh release/VaultOne-debug.apk

      # ---------------------------------------------------------
      # 13. Upload APK
      # ---------------------------------------------------------
      - name: Upload VaultOne APK
        uses: actions/upload-artifact@v4
        with:
          name: VaultOne-APK
          path: VaultOne-Android/release/VaultOne-debug.apk
          if-no-files-found: error

      # ---------------------------------------------------------
      # 14. Upload build reports
      # ---------------------------------------------------------
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VaultOne-Build-Reports
          path: |
            VaultOne-Android/**/build/reports/**
          if-no-files-found: ignore
