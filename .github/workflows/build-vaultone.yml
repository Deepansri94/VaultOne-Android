name: Build VaultOne APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
    contents: write

env:
    JAVA_VERSION: '17'
    GRADLE_VERSION: '8.7'
    AGP_VERSION: '8.6.1'
    ANDROID_API: '35'
    BUILD_TOOLS_VERSION: '35.0.0'
    VERSION_CODE: ${{ github.run_number }}
    VERSION_NAME: '2.${{ github.run_number }}'

jobs:

  build:
    name: Build VaultOne APK
    runs-on: ubuntu-latest

    steps:

      # 1. CHECKOUT
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. JAVA 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # 3. SETUP GRADLE
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # 4. ANDROID SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS_VERSION}"
          echo "Android SDK installation completed."

      # 5. ENVIRONMENT CHECK
      - name: Check build environment
        shell: bash
        run: |
          set -e
          java -version
          gradle --version
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

      # 6. VALIDATE MODULAR APP FILES
      # Modular architecture: index.html is the entry point.
      # All HTML/JS/CSS files must be present.
      - name: Validate modular app files
        shell: bash
        run: |
          set -e
          MISSING=""
          for f in index.html shared.js shared.css \
                   sw.js VaultOne.png \
                   iVault.html iVault.js \
                   FamilyVault.html FamilyVault.js \
                   PasswordVault.html PasswordVault.js; do
            if [ ! -f "./$f" ]; then
              MISSING="$MISSING $f"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "ERROR: Missing required files:$MISSING"
            exit 1
          fi
          echo "All modular app files present."
           ls -lh index.html shared.js shared.css sw.js VaultOne.png \
                 iVault.html iVault.js \
                 FamilyVault.html FamilyVault.js \
                 PasswordVault.html PasswordVault.js

      # 7. CREATE ANDROID PROJECT STRUCTURE
      - name: Create Android project structure
        shell: bash
        run: |
          set -e
          mkdir -p \
            app/src/main/java/com/deepansri94/vaultone/app \
            app/src/main/assets \
            app/src/main/res/values \
            app/src/main/res/mipmap-mdpi \
            app/src/main/res/mipmap-hdpi \
            app/src/main/res/mipmap-xhdpi \
            app/src/main/res/mipmap-xxhdpi \
            app/src/main/res/mipmap-xxxhdpi \
            gradle/wrapper
          echo "Android project directories created."

      # 8. COPY APP ICON
      - name: Copy app icon
        shell: bash
        run: |
          set -e
          if [ ! -f "VaultOne.png" ]; then
            echo "ERROR: VaultOne.png not found in repo root."
            exit 1
          fi
          sudo apt-get install -y imagemagick >/dev/null 2>&1
          convert VaultOne.png -resize 48x48   app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert VaultOne.png -resize 72x72   app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert VaultOne.png -resize 96x96   app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert VaultOne.png -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert VaultOne.png -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          echo "App icons generated."

      # 9. COPY ALL MODULAR APP FILES INTO ASSETS
      # Entry point: index.html
      # All pages share shared.js + shared.css
      - name: Copy modular web application to assets
        shell: bash
        run: |
          set -e
          cp index.html          app/src/main/assets/index.html
          cp shared.js           app/src/main/assets/shared.js
          cp shared.css          app/src/main/assets/shared.css
          cp sw.js              app/src/main/assets/sw.js
          cp VaultOne.png       app/src/main/assets/VaultOne.png
          cp iVault.html         app/src/main/assets/iVault.html
          cp iVault.js           app/src/main/assets/iVault.js
          cp FamilyVault.html    app/src/main/assets/FamilyVault.html
          cp FamilyVault.js      app/src/main/assets/FamilyVault.js
          cp PasswordVault.html  app/src/main/assets/PasswordVault.html
          cp PasswordVault.js    app/src/main/assets/PasswordVault.js
          if [ -f "vaultone_seed.json" ]; then
            cp vaultone_seed.json app/src/main/assets/vaultone_seed.json
            echo "Seed JSON copied."
          fi
          echo "Assets:"
          ls -lh app/src/main/assets/

      # 10. CREATE SETTINGS.GRADLE
      - name: Create settings.gradle
        shell: bash
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "VaultOne"
          include(":app")
          EOF

      # 11. CREATE ROOT BUILD.GRADLE
      - name: Create root build.gradle
        shell: bash
        run: |
          cat > build.gradle <<EOF
          plugins {
              id 'com.android.application' version '${AGP_VERSION}' apply false
          }
          EOF

      # 12. CREATE GRADLE.PROPERTIES
      - name: Create gradle.properties
        shell: bash
        run: |
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          android.defaults.buildfeatures.buildconfig=true
          EOF

      # 13. CREATE APP BUILD.GRADLE (signing config added in step 24 after keystore is generated)
      - name: Create app build.gradle
        shell: bash
        run: |
          cat > app/build.gradle <<EOF
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.deepansri94.vaultone.app'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.deepansri94.vaultone.app'
                  minSdk 24
                  targetSdk 35
                  versionCode ${VERSION_CODE}
                  versionName '${VERSION_NAME}'
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          dependencies {
              implementation 'androidx.webkit:webkit:1.11.0'
              implementation 'androidx.core:core:1.13.0'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.activity:activity:1.9.0'
          }
          EOF

      # 14. CREATE ANDROIDMANIFEST.XML
      - name: Create AndroidManifest.xml
        shell: bash
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="false"
                  android:label="VaultOne"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:hardwareAccelerated="true"
                  android:resizeableActivity="true"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="unspecified">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".ReminderReceiver"
                      android:exported="false" />

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="com.deepansri94.vaultone.app.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>

              </application>
          </manifest>
          EOF

      # 14b. CREATE FILE PROVIDER PATHS
      - name: Create FileProvider paths XML
        shell: bash
        run: |
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/file_paths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="apk_cache" path="apk/" />
          </paths>
          EOF

      # 15. CREATE THEME
      - name: Create Android theme
        shell: bash
        run: |
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <!-- Must use Theme.AppCompat parent because MainActivity extends AppCompatActivity -->
              <style name="AppTheme" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:navigationBarColor">#080D18</item>
                  <item name="android:statusBarColor">#080D18</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="colorAccent">#5B5FEF</item>
              </style>
          </resources>
          EOF


      # 16. CREATE MAINACTIVITY.JAVA
      # Entry point loads index.html (modular architecture).
      # WebViewAssetLoader serves all assets from the same origin
      # so navigation between index/iVault/FamilyVault/PasswordVault works.
      - name: Create MainActivity.java
        shell: bash
        run: |
          cat > app/src/main/java/com/deepansri94/vaultone/app/MainActivity.java <<'EOF'
          package com.deepansri94.vaultone.app;

          import android.app.Activity;
          import android.app.AlarmManager;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.PowerManager;
          import android.provider.MediaStore;
          import android.provider.Settings;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import androidx.activity.OnBackPressedCallback;
          import androidx.activity.result.ActivityResultLauncher;
          import androidx.activity.result.contract.ActivityResultContracts;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.NotificationManagerCompat;
          import androidx.core.content.ContextCompat;
          import androidx.webkit.WebViewAssetLoader;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          public class MainActivity extends AppCompatActivity {

              private WebView webView;
              private WebViewAssetLoader assetLoader;
              private ValueCallback<Uri[]> filePathCallback;
              private ActivityResultLauncher<Intent> filePickerLauncher;

              private static final String REMINDER_CHANNEL_ID = "vaultone_reminders";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  filePickerLauncher = registerForActivityResult(
                      new ActivityResultContracts.StartActivityForResult(),
                      result -> {
                          if (filePathCallback == null) return;
                          Uri[] results = null;
                          if (result.getResultCode() == Activity.RESULT_OK
                                  && result.getData() != null
                                  && result.getData().getData() != null) {
                              results = new Uri[]{ result.getData().getData() };
                          }
                          filePathCallback.onReceiveValue(results);
                          filePathCallback = null;
                      }
                  );

                  createReminderNotificationChannel();

                  webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(false);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);

                  // WebViewAssetLoader serves all modular files from the same
                  // https://appassets.androidplatform.net/assets/ origin,
                  // so href="iVault.html", href="shared.js" etc. all resolve correctly.
                  assetLoader = new WebViewAssetLoader.Builder()
                          .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                          .build();

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(
                              WebView view, WebResourceRequest request) {
                          return assetLoader.shouldInterceptRequest(request.getUrl());
                      }

                      @Override
                      @SuppressWarnings("deprecation")
                      public WebResourceResponse shouldInterceptRequest(
                              WebView view, String url) {
                          return assetLoader.shouldInterceptRequest(Uri.parse(url));
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          injectSeedData();
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView view,
                              ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if (filePathCallback != null) filePathCallback.onReceiveValue(null);
                          filePathCallback = callback;
                          Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("application/json");
                          intent.putExtra(Intent.EXTRA_MIME_TYPES,
                                  new String[]{"application/json", "text/plain"});
                          try {
                              filePickerLauncher.launch(
                                      Intent.createChooser(intent, "Select VaultOne backup JSON"));
                          } catch (Exception e) {
                              filePathCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  webView.addJavascriptInterface(new VaultOneAndroidBridge(this), "VaultOneAndroid");
                  setContentView(webView);

                  // Load the modular entry point
                  webView.loadUrl("https://appassets.androidplatform.net/assets/index.html");

                  // Check for update in background
                  checkForUpdate();

                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      @Override
                      public void handleOnBackPressed() {
                          if (webView != null && webView.canGoBack()) {
                              webView.goBack();
                          } else {
                              setEnabled(false);
                              getOnBackPressedDispatcher().onBackPressed();
                          }
                      }
                  });
              }

              // ── Auto-update ──────────────────────────────────────────────
              private static final String RELEASES_API =
                  "https://api.github.com/repos/Deepansri94/VaultOne-Android/releases/latest";
              private static final int CURRENT_VERSION_CODE = BuildConfig.VERSION_CODE;

              private void checkForUpdate() {
                  new Thread(() -> {
                      try {
                          HttpURLConnection conn =
                              (HttpURLConnection) new URL(RELEASES_API).openConnection();
                          conn.setConnectTimeout(5000);
                          conn.setReadTimeout(5000);
                          conn.setRequestProperty("Accept", "application/vnd.github+json");
                          conn.setRequestProperty("X-GitHub-Api-Version", "2022-11-28");
                          java.io.BufferedReader br = new java.io.BufferedReader(
                              new java.io.InputStreamReader(conn.getInputStream()));
                          StringBuilder sb = new StringBuilder();
                          String line;
                          while ((line = br.readLine()) != null) sb.append(line);
                          br.close();
                          conn.disconnect();
                          String json = sb.toString();
                          // tag_name is "build-{versionCode}"
                          String tag = parseStringField(json, "tag_name");
                          String remoteName = parseStringField(json, "name");
                          int remoteCode = tag.startsWith("build-")
                              ? Integer.parseInt(tag.substring(6)) : -1;
                          // Extract APK browser_download_url from assets array. Fall back to
                          // the deterministic GitHub release URL if parsing changes upstream.
                          String apkUrl = parseApkUrl(json);
                          if (!isHttpUrl(apkUrl) && tag.startsWith("build-")) {
                              apkUrl = "https://github.com/Deepansri94/VaultOne-Android/releases/download/"
                                  + tag + "/VaultOne.apk";
                          }
                          if (remoteCode > CURRENT_VERSION_CODE && apkUrl != null) {
                              final String finalUrl = apkUrl;
                              final String finalName = remoteName;
                              runOnUiThread(() -> showUpdateDialog(finalName, finalUrl));
                          }
                      } catch (Exception e) {
                          // No network or token invalid — silently skip
                      }
                  }).start();
              }

              private String parseApkUrl(String json) {
                  try {
                      String url = parseStringField(json, "browser_download_url");
                      if (url != null && url.endsWith(".apk")) return url;
                      // scan all occurrences in case first field is not the APK
                      int idx = 0;
                      while (true) {
                          idx = json.indexOf("browser_download_url", idx);
                          if (idx < 0) return null;
                          int q1 = json.indexOf('"', json.indexOf(':', idx));
                          int q2 = json.indexOf('"', q1 + 1);
                          String candidate = json.substring(q1 + 1, q2);
                          if (candidate.endsWith(".apk")) return candidate;
                          idx++;
                      }
                  } catch (Exception e) { return null; }
              }

              private boolean isHttpUrl(String value) {
                  if (value == null || value.trim().isEmpty()) return false;
                  try {
                      java.net.URI uri = new java.net.URI(value.trim());
                      return ("http".equalsIgnoreCase(uri.getScheme())
                          || "https".equalsIgnoreCase(uri.getScheme()))
                          && uri.getHost() != null;
                  } catch (Exception e) { return false; }
              }

              private void showUpdateDialog(String versionName, String apkUrl) {
                  new android.app.AlertDialog.Builder(this)
                      .setTitle("Update Available")
                      .setMessage("VaultOne " + versionName + " is available. Install now?")
                      .setPositiveButton("Update", (d, w) -> downloadAndInstall(apkUrl))
                      .setNegativeButton("Later", null)
                      .show();
              }

              private void downloadAndInstall(String apkUrl) {
                  if (!isHttpUrl(apkUrl)) {
                      Toast.makeText(this, "Update link is invalid. Please try again later.", Toast.LENGTH_LONG).show();
                      return;
                  }
                  Toast.makeText(this, "Downloading update...", Toast.LENGTH_SHORT).show();
                  new Thread(() -> {
                      try {
                          File cacheDir = new File(getCacheDir(), "apk");
                          cacheDir.mkdirs();
                          File apkFile = new File(cacheDir, "VaultOne_update.apk");
                          HttpURLConnection conn =
                              (HttpURLConnection) new URL(apkUrl.trim()).openConnection();
                          conn.setConnectTimeout(15000);
                          conn.setReadTimeout(60000);
                          conn.setRequestProperty("Accept", "application/octet-stream");
                          conn.setInstanceFollowRedirects(true);
                          if (conn.getResponseCode() < 200 || conn.getResponseCode() >= 300) {
                              throw new java.io.IOException("Update server returned HTTP " + conn.getResponseCode());
                          }
                          try (InputStream in = conn.getInputStream();
                               FileOutputStream out = new FileOutputStream(apkFile)) {
                              byte[] buf = new byte[8192];
                              int n;
                              while ((n = in.read(buf)) != -1) out.write(buf, 0, n);
                          }
                          conn.disconnect();
                          runOnUiThread(() -> installApk(apkFile));
                      } catch (Exception e) {
                          runOnUiThread(() -> Toast.makeText(this,
                              "Download failed: " + e.getMessage(),
                              Toast.LENGTH_LONG).show());
                      }
                  }).start();
              }

              private void installApk(File apkFile) {
                  Uri apkUri = androidx.core.content.FileProvider.getUriForFile(
                      this, "com.deepansri94.vaultone.app.fileprovider", apkFile);
                  Intent intent = new Intent(Intent.ACTION_VIEW);
                  intent.setDataAndType(apkUri, "application/vnd.android.package-archive");
                  intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  startActivity(intent);
              }

              private String parseStringField(String json, String key) {
                  try {
                      String pattern = "\"" + key + "\"";
                      int idx = json.indexOf(pattern);
                      if (idx < 0) return "";
                      String rest = json.substring(idx + pattern.length());
                      int q1 = rest.indexOf('"');
                      int q2 = rest.indexOf('"', q1 + 1);
                      return rest.substring(q1 + 1, q2);
                  } catch (Exception e) { return ""; }
              }
              // ── End auto-update ──────────────────────────────────────────

              private boolean seedInjected = false;

              private void injectSeedData() {
                  if (seedInjected) return;
                  seedInjected = true;
                  try {
                      java.io.InputStream is = getAssets().open("vaultone_seed.json");
                      byte[] buffer = new byte[is.available()];
                      is.read(buffer);
                      is.close();
                      String json = new String(buffer, "UTF-8")
                              .replace("\\", "\\\\")
                              .replace("'", "\\'");
                      webView.evaluateJavascript(
                              "window.__vaultSeedJSON = '" + json + "';", null);
                  } catch (Exception e) {
                      // No seed file — fresh install
                  }
              }

              private static class VaultOneAndroidBridge {

                  private final Context context;
                  private final Activity activity;

                  VaultOneAndroidBridge(Activity activity) {
                      this.activity = activity;
                      this.context = activity.getApplicationContext();
                  }

                  @JavascriptInterface
                  public boolean saveExport(String json, String fileName) {
                      Uri itemUri = null;
                      try {
                          String safeName = (fileName == null || fileName.trim().isEmpty())
                                  ? "VaultOne_Backup.json"
                                  : fileName.replaceAll("[^a-zA-Z0-9._-]", "_");
                          byte[] data = (json == null ? "{}" : json).getBytes("UTF-8");
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              ContentValues values = new ContentValues();
                              values.put(MediaStore.Downloads.DISPLAY_NAME, safeName);
                              values.put(MediaStore.Downloads.MIME_TYPE, "application/json");
                              values.put(MediaStore.Downloads.RELATIVE_PATH,
                                      Environment.DIRECTORY_DOWNLOADS);
                              values.put(MediaStore.Downloads.IS_PENDING, 1);
                              itemUri = context.getContentResolver().insert(
                                      MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                              if (itemUri == null) return false;
                              try (OutputStream out =
                                           context.getContentResolver().openOutputStream(itemUri)) {
                                  if (out == null) throw new java.io.IOException("Could not open Downloads file");
                                  out.write(data);
                              }
                              values.clear();
                              values.put(MediaStore.Downloads.IS_PENDING, 0);
                              context.getContentResolver().update(itemUri, values, null, null);
                          } else {
                              java.io.File dir = Environment.getExternalStoragePublicDirectory(
                                      Environment.DIRECTORY_DOWNLOADS);
                              if (!dir.exists()) dir.mkdirs();
                              try (java.io.FileOutputStream fos = new java.io.FileOutputStream(
                                      new java.io.File(dir, safeName))) {
                                  fos.write(data);
                              }
                          }
                          activity.runOnUiThread(() -> Toast.makeText(context,
                                  "Saved to Downloads: " + safeName,
                                  Toast.LENGTH_LONG).show());
                          return true;
                      } catch (Exception e) {
                          if (itemUri != null && Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              try { context.getContentResolver().delete(itemUri, null, null); } catch (Exception ignored) { }
                          }
                          return false;
                      }
                  }

                  @JavascriptInterface
                  public boolean hasNotificationPermission() {
                      if (Build.VERSION.SDK_INT >= 33) {
                          return ContextCompat.checkSelfPermission(context,
                                  android.Manifest.permission.POST_NOTIFICATIONS)
                                  == PackageManager.PERMISSION_GRANTED;
                      }
                      return NotificationManagerCompat.from(context)
                              .areNotificationsEnabled();
                  }

                  @JavascriptInterface
                  public void requestNotificationPermission() {
                      if (Build.VERSION.SDK_INT >= 33) {
                          activity.runOnUiThread(() -> activity.requestPermissions(
                                  new String[]{android.Manifest.permission.POST_NOTIFICATIONS},
                                  48213));
                      }
                  }

                  @JavascriptInterface
                  public boolean scheduleReminderNotification(
                          String id, String title, String body, String triggerAtMillis) {
                      try {
                          long when = Long.parseLong(triggerAtMillis);
                          if (when <= System.currentTimeMillis()) return false;
                          int requestCode = stableRequestCode(id);
                          Intent intent = new Intent(context, ReminderReceiver.class);
                          intent.putExtra("notificationId", requestCode);
                          intent.putExtra("title", title);
                          intent.putExtra("body", body);
                          PendingIntent pi = PendingIntent.getBroadcast(
                                  context, requestCode, intent,
                                  PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                          AlarmManager am = (AlarmManager) context.getSystemService(Context.ALARM_SERVICE);
                          if (am == null) return false;
                          try {
                              if (Build.VERSION.SDK_INT >= 31 && !am.canScheduleExactAlarms()) {
                                  am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, when, pi);
                              } else {
                                  am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, when, pi);
                              }
                          } catch (SecurityException se) {
                              am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, when, pi);
                          }
                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  }

                  @JavascriptInterface
                  public boolean cancelReminderNotification(String id) {
                      try {
                          int requestCode = stableRequestCode(id);
                          Intent intent = new Intent(context, ReminderReceiver.class);
                          PendingIntent pi = PendingIntent.getBroadcast(
                                  context, requestCode, intent,
                                  PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                          AlarmManager am = (AlarmManager) context.getSystemService(Context.ALARM_SERVICE);
                          if (am != null) am.cancel(pi);
                          pi.cancel();
                          NotificationManagerCompat.from(context).cancel(requestCode);
                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  }

                  @JavascriptInterface
                  public boolean isIgnoringBatteryOptimizations() {
                      PowerManager pm = (PowerManager) context.getSystemService(Context.POWER_SERVICE);
                      if (pm == null) return false;
                      return pm.isIgnoringBatteryOptimizations(context.getPackageName());
                  }

                  @JavascriptInterface
                  public void requestIgnoreBatteryOptimizations() {
                      try {
                          Intent intent = new Intent(
                                  Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                          intent.setData(Uri.parse("package:" + context.getPackageName()));
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          context.startActivity(intent);
                      } catch (Exception e) {
                          // OEM does not support this intent
                      }
                  }

                  private int stableRequestCode(String id) {
                      if (id == null) return 0;
                      return (id.hashCode() & 0x7fffffff) % 1000000000;
                  }
              }

              private void createReminderNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                              REMINDER_CHANNEL_ID, "VaultOne Reminders",
                              NotificationManager.IMPORTANCE_DEFAULT);
                      channel.setDescription("Reminder notifications from VaultOne");
                      NotificationManager manager = getSystemService(NotificationManager.class);
                      if (manager != null) manager.createNotificationChannel(channel);
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.stopLoading();
                      webView.loadUrl("about:blank");
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }
          }
          EOF

      # 17. CREATE REMINDERRECEIVER.JAVA
      - name: Create ReminderReceiver.java
        shell: bash
        run: |
          cat > app/src/main/java/com/deepansri94/vaultone/app/ReminderReceiver.java <<'EOF'
          package com.deepansri94.vaultone.app;

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;

          import androidx.core.app.NotificationCompat;
          import androidx.core.app.NotificationManagerCompat;

          public class ReminderReceiver extends BroadcastReceiver {

              private static final String CHANNEL_ID = "vaultone_reminders";

              @Override
              public void onReceive(Context context, Intent intent) {
                  int notificationId = intent.getIntExtra("notificationId", 0);
                  String title = intent.getStringExtra("title");
                  String body  = intent.getStringExtra("body");
                  if (title == null || title.isEmpty()) title = "VaultOne Reminder";
                  if (body  == null) body = "";

                  ensureChannel(context);

                  NotificationCompat.Builder builder =
                          new NotificationCompat.Builder(context, CHANNEL_ID)
                                  .setSmallIcon(android.R.drawable.ic_popup_reminder)
                                  .setContentTitle(title)
                                  .setContentText(body)
                                  .setStyle(new NotificationCompat.BigTextStyle().bigText(body))
                                  .setPriority(NotificationCompat.PRIORITY_DEFAULT)
                                  .setAutoCancel(true);

                  Intent launchIntent = context.getPackageManager()
                          .getLaunchIntentForPackage(context.getPackageName());
                  if (launchIntent != null) {
                      launchIntent.setFlags(
                              Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                      PendingIntent contentIntent = PendingIntent.getActivity(
                              context, notificationId, launchIntent,
                              PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                      builder.setContentIntent(contentIntent);
                  }

                  try {
                      NotificationManagerCompat.from(context).notify(notificationId, builder.build());
                  } catch (SecurityException e) {
                      // POST_NOTIFICATIONS not granted
                  }
              }

              private void ensureChannel(Context context) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationManager manager = (NotificationManager)
                              context.getSystemService(Context.NOTIFICATION_SERVICE);
                      if (manager != null && manager.getNotificationChannel(CHANNEL_ID) == null) {
                          NotificationChannel channel = new NotificationChannel(
                                  CHANNEL_ID, "VaultOne Reminders",
                                  NotificationManager.IMPORTANCE_DEFAULT);
                          channel.setDescription("Reminder notifications from VaultOne");
                          manager.createNotificationChannel(channel);
                      }
                  }
              }
          }
          EOF

      # 18. INSPECT GENERATED PROJECT
      - name: Inspect generated Android project
        shell: bash
        run: |
          find . -maxdepth 6 -type f \
            \( -name "*.gradle" -o -name "*.xml" -o -name "*.java" \
               -o -name "*.html" -o -name "*.js" -o -name "*.css" \
               -o -name "gradle.properties" \) \
            -not -path "./.git/*" -print | sort

      # 19. VALIDATE GRADLE PROJECT
      - name: Validate Gradle project
        shell: bash
        run: gradle --no-daemon :app:tasks --stacktrace

      # 20. GENERATE GRADLE WRAPPER
      - name: Generate Gradle Wrapper
        shell: bash
        run: |
          set -e
          gradle --no-daemon wrapper \
            --gradle-version "${GRADLE_VERSION}" \
            --distribution-type bin
          chmod +x ./gradlew

      # 21. VERIFY WRAPPER
      - name: Verify Gradle Wrapper
        shell: bash
        run: |
          set -e
          chmod +x ./gradlew
          cat ./gradle/wrapper/gradle-wrapper.properties
          ./gradlew --version

      # 22. CLEAN
      - name: Clean Android project
        shell: bash
        run: ./gradlew --no-daemon clean --stacktrace

      # 23. DECODE RELEASE KEYSTORE FROM SECRET
      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e
          echo "$KEYSTORE_BASE64" | base64 -d > vaultone-release.jks
          echo "Keystore decoded."

      # 24. CONFIGURE RELEASE SIGNING IN APP BUILD.GRADLE
      - name: Add signing config to app build.gradle
        shell: bash
        run: |
          cat > app/build.gradle <<EOF
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.deepansri94.vaultone.app'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.deepansri94.vaultone.app'
                  minSdk 24
                  targetSdk 35
                  versionCode ${VERSION_CODE}
                  versionName '${VERSION_NAME}'
              }
              signingConfigs {
                  release {
                      storeFile file(rootProject.projectDir.absolutePath + '/vaultone-release.jks')
                      storePassword 'vaultone123'
                      keyAlias 'vaultone'
                      keyPassword 'vaultone123'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          dependencies {
              implementation 'androidx.webkit:webkit:1.11.0'
              implementation 'androidx.core:core:1.13.0'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.activity:activity:1.9.0'
          }
          EOF

      # 25. BUILD RELEASE APK
      - name: Build VaultOne Release APK
        shell: bash
        run: ./gradlew --no-daemon assembleRelease --stacktrace

      # 26. VERIFY APK
      - name: Verify APK
        shell: bash
        run: |
          set -e
          RELEASE_APK="./app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$RELEASE_APK" ]; then
            echo "ERROR: APK not found."
            find . -type f -name "*.apk" -not -path "./.git/*" -print || true
            exit 1
          fi
          echo "SUCCESS: APK generated."
          ls -lh "$RELEASE_APK"

      # 27. PREPARE ARTIFACT
      - name: Prepare VaultOne APK
        shell: bash
        run: |
          mkdir -p release
          cp "./app/build/outputs/apk/release/app-release.apk" "./release/VaultOne.apk"
          ls -lh "./release/VaultOne.apk"

      # 26. UPLOAD APK
      - name: Upload VaultOne APK
        uses: actions/upload-artifact@v4
        with:
          name: VaultOne-APK
          path: release/VaultOne.apk
          if-no-files-found: error

      # 27. UPLOAD BUILD REPORTS
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VaultOne-Build-Reports
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
          if-no-files-found: ignore

      # 28. CREATE GITHUB RELEASE AND UPLOAD APK
      - name: Create GitHub Release and upload APK
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="build-${VERSION_CODE}"
          RELEASE_NAME="VaultOne ${VERSION_NAME}"

          # Create release and parse upload_url with python3
          RELEASE_RESPONSE=$(curl -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"${RELEASE_NAME}\",\"body\":\"Automated build from commit ${GITHUB_SHA}\",\"draft\":false,\"prerelease\":false}")

          echo "Release API response: $RELEASE_RESPONSE"

          UPLOAD_URL=$(echo "$RELEASE_RESPONSE" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          url = data.get('upload_url','')
          print(url.split('{')[0])
          ")

          if [ -z "$UPLOAD_URL" ]; then
            echo "ERROR: Could not extract upload_url from release response."
            exit 1
          fi
          echo "Upload URL: $UPLOAD_URL"

          # Upload APK asset
          curl -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/vnd.android.package-archive" \
            "${UPLOAD_URL}?name=VaultOne.apk" \
            --data-binary @release/VaultOne.apk

          echo "Release ${RELEASE_NAME} published with APK asset."
