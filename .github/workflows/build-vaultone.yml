name: Build VaultOne APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.7'
  AGP_VERSION: '8.6.1'
  ANDROID_API: '35'
  BUILD_TOOLS_VERSION: '35.0.0'
  APP_ID: 'com.vaultone.app'
  APP_NAME: 'VaultOne'


jobs:

  build:
    name: Build VaultOne APK
    runs-on: ubuntu-latest

    steps:

      # 1. CHECKOUT
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. JAVA 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # 3. SETUP GRADLE
      # gradle/actions/setup-gradle@v3 supports the gradle-version input.
      # v4 dropped that input so we pin to v3.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # 4. ANDROID SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS_VERSION}"
          echo "Android SDK installation completed."

      # 5. ENVIRONMENT CHECK
      - name: Check build environment
        shell: bash
        run: |
          set -e
          java -version
          gradle --version
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          git --version

      # 6. FIND VAULTONE.HTML
      - name: Find VaultOne HTML
        shell: bash
        run: |
          set -e
          HTML_FILE=""
          if [ -f "./VaultOne.html" ]; then
            HTML_FILE="./VaultOne.html"
          else
            HTML_FILE=$(find . \
              -type f \
              -name "VaultOne.html" \
              -not -path "./.git/*" \
              -not -path "./app/build/*" \
              | head -n 1 || true)
          fi
          if [ -z "$HTML_FILE" ]; then
            echo "ERROR: VaultOne.html not found."
            find . -type f \( -iname "*.html" -o -iname "*.htm" \) \
              -not -path "./.git/*" -not -path "./app/build/*" -print || true
            exit 1
          fi
          HTML_FILE="${HTML_FILE#./}"
          echo "Found: $HTML_FILE"
          echo "$HTML_FILE" > vaultone-html-path.txt

      # 7. VALIDATE HTML
      - name: Validate VaultOne HTML
        shell: bash
        run: |
          set -e
          HTML_FILE=$(cat vaultone-html-path.txt)
          FILE_SIZE=$(wc -c < "$HTML_FILE")
          echo "HTML size: ${FILE_SIZE} bytes"
          if [ "$FILE_SIZE" -lt 100 ]; then
            echo "ERROR: VaultOne.html appears empty or invalid."
            exit 1
          fi
          head -n 10 "$HTML_FILE" || true

      # 8. OFFLINE DEPENDENCY CHECK (warning only, does not fail build)
      - name: Check VaultOne offline dependencies
        shell: bash
        run: |
          set +e
          HTML_FILE=$(cat vaultone-html-path.txt)
          EXTERNAL_COUNT=$(grep -Eoi 'https?://[^"'"'"' )<>]+' "$HTML_FILE" | sort -u | wc -l)
          if [ "$EXTERNAL_COUNT" -gt 0 ]; then
            echo "WARNING: External URLs detected:"
            grep -Eoi 'https?://[^"'"'"' )<>]+' "$HTML_FILE" | sort -u | head -n 30
          else
            echo "No external URLs detected."
          fi

      # 9. CREATE ANDROID PROJECT STRUCTURE
      - name: Create Android project structure
        shell: bash
        run: |
          set -e
          mkdir -p \
            app/src/main/java/com/vaultone/app \
            app/src/main/assets \
            app/src/main/res/values \
            app/src/main/res/mipmap-mdpi \
            app/src/main/res/mipmap-hdpi \
            app/src/main/res/mipmap-xhdpi \
            app/src/main/res/mipmap-xxhdpi \
            app/src/main/res/mipmap-xxxhdpi \
            gradle/wrapper
          echo "Android project directories created."

      # 10. COPY APP ICON
      - name: Copy app icon
        shell: bash
        run: |
          set -e
          if [ ! -f "VaultOne.png" ]; then
            echo "ERROR: VaultOne.png not found in repo root."
            exit 1
          fi
          sudo apt-get install -y imagemagick >/dev/null 2>&1
          convert VaultOne.png -resize 48x48   app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert VaultOne.png -resize 72x72   app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert VaultOne.png -resize 96x96   app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert VaultOne.png -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert VaultOne.png -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          echo "App icons generated."

      # 11. COPY VAULTONE.HTML AND SEED JSON
      - name: Copy VaultOne web application
        shell: bash
        run: |
          set -e
          HTML_FILE=$(cat vaultone-html-path.txt)
          cp "$HTML_FILE" "app/src/main/assets/VaultOne.html"
          if [ ! -f "app/src/main/assets/VaultOne.html" ]; then
            echo "ERROR: Failed to copy VaultOne.html."
            exit 1
          fi
          if [ -f "./vaultone_seed.json" ]; then
            cp "./vaultone_seed.json" "app/src/main/assets/vaultone_seed.json"
            echo "Seed JSON copied."
          else
            echo "WARNING: vaultone_seed.json not found. Skipping."
          fi
          ls -lh app/src/main/assets/

      # 12. CREATE SETTINGS.GRADLE
      - name: Create settings.gradle
        shell: bash
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "VaultOne"
          include(":app")
          EOF

      # 13. CREATE ROOT BUILD.GRADLE
      # AGP version is taken from the AGP_VERSION env var.
      - name: Create root build.gradle
        shell: bash
        run: |
          cat > build.gradle <<EOF
          plugins {
              id 'com.android.application' version '${AGP_VERSION}' apply false
          }
          EOF

      # 14. CREATE GRADLE.PROPERTIES
      - name: Create gradle.properties
        shell: bash
        run: |
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          android.defaults.buildfeatures.buildconfig=false
          EOF

      # 15. CREATE APP BUILD.GRADLE
      # androidx.webkit:webkit:1.11.0  — latest stable
      # androidx.core:core:1.13.0      — latest stable
      # androidx.appcompat:appcompat:1.7.0 — required for AppCompatActivity
      # androidx.activity:activity:1.9.0   — required for ActivityResultLauncher + OnBackPressedDispatcher
      - name: Create app build.gradle
        shell: bash
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.vaultone.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.vaultone.app'
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                      shrinkResources false
                  }
                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.11.0'
              implementation 'androidx.core:core:1.13.0'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.activity:activity:1.9.0'
          }
          EOF


      # 16. CREATE ANDROIDMANIFEST.XML
      - name: Create AndroidManifest.xml
        shell: bash
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />

              <application
                  android:allowBackup="false"
                  android:label="VaultOne"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:resizeableActivity="true"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="unspecified">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".ReminderReceiver"
                      android:exported="false" />

              </application>
          </manifest>
          EOF

      # 17. CREATE THEME
      - name: Create Android theme
        shell: bash
        run: |
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#5B5FEF</item>
                  <item name="android:navigationBarColor">#080D18</item>
                  <item name="android:statusBarColor">#080D18</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

      # 18. CREATE MAINACTIVITY.JAVA
      # Fixed: onBackPressed() replaced with OnBackPressedDispatcher (API 33+ deprecation)
      # Fixed: startActivityForResult replaced with ActivityResultLauncher (API 29+ deprecation)
      # Fixed: setDatabaseEnabled removed (deprecated no-op since API 19)
      - name: Create MainActivity.java
        shell: bash
        run: |
          cat > app/src/main/java/com/vaultone/app/MainActivity.java <<'EOF'
          package com.vaultone.app;

          import android.app.Activity;
          import android.app.AlarmManager;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.PowerManager;
          import android.provider.MediaStore;
          import android.provider.Settings;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import androidx.activity.result.ActivityResultLauncher;
          import androidx.activity.result.contract.ActivityResultContracts;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.NotificationManagerCompat;
          import androidx.core.content.ContextCompat;
          import androidx.webkit.WebViewAssetLoader;

          import java.io.OutputStream;

          public class MainActivity extends AppCompatActivity {

              private WebView webView;
              private WebViewAssetLoader assetLoader;
              private ValueCallback<Uri[]> filePathCallback;

              private static final String REMINDER_CHANNEL_ID = "vaultone_reminders";
              private static final int NOTIFICATION_PERMISSION_REQUEST_CODE = 48213;

              private ActivityResultLauncher<Intent> filePickerLauncher;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  // Register file picker launcher (replaces deprecated startActivityForResult)
                  filePickerLauncher = registerForActivityResult(
                      new ActivityResultContracts.StartActivityForResult(),
                      result -> {
                          if (filePathCallback == null) return;
                          Uri[] results = null;
                          if (result.getResultCode() == Activity.RESULT_OK
                                  && result.getData() != null
                                  && result.getData().getData() != null) {
                              results = new Uri[]{ result.getData().getData() };
                          }
                          filePathCallback.onReceiveValue(results);
                          filePathCallback = null;
                      }
                  );

                  createReminderNotificationChannel();

                  webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(false);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);

                  assetLoader = new WebViewAssetLoader.Builder()
                          .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                          .build();

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          return assetLoader.shouldInterceptRequest(request.getUrl());
                      }

                      @Override
                      @SuppressWarnings("deprecation")
                      public WebResourceResponse shouldInterceptRequest(WebView view, String url) {
                          return assetLoader.shouldInterceptRequest(Uri.parse(url));
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          injectSeedData();
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback,
                              FileChooserParams params) {
                          if (filePathCallback != null) filePathCallback.onReceiveValue(null);
                          filePathCallback = callback;
                          Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("application/json");
                          intent.putExtra(Intent.EXTRA_MIME_TYPES,
                                  new String[]{"application/json", "text/plain"});
                          try {
                              filePickerLauncher.launch(Intent.createChooser(intent, "Select VaultOne backup JSON"));
                          } catch (Exception e) {
                              filePathCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  webView.addJavascriptInterface(new VaultOneAndroidBridge(), "VaultOneAndroid");
                  setContentView(webView);
                  webView.loadUrl("https://appassets.androidplatform.net/assets/VaultOne.html");

                  // Handle back press using OnBackPressedDispatcher (replaces deprecated onBackPressed)
                  getOnBackPressedDispatcher().addCallback(this,
                      new androidx.activity.OnBackPressedCallback(true) {
                          @Override
                          public void handleOnBackPressed() {
                              if (webView != null && webView.canGoBack()) {
                                  webView.goBack();
                              } else {
                                  setEnabled(false);
                                  getOnBackPressedDispatcher().onBackPressed();
                              }
                          }
                      }
                  );
              }

              private void injectSeedData() {
                  try {
                      java.io.InputStream is = getAssets().open("vaultone_seed.json");
                      byte[] buffer = new byte[is.available()];
                      is.read(buffer);
                      is.close();
                      String json = new String(buffer, "UTF-8")
                              .replace("\\", "\\\\")
                              .replace("'", "\\'");
                      webView.evaluateJavascript("window.__vaultSeedJSON = '" + json + "';", null);
                  } catch (Exception e) {
                      // No seed file — fresh install
                  }
              }

              private class VaultOneAndroidBridge {

                  @JavascriptInterface
                  public boolean saveExport(String json, String fileName) {
                      try {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              ContentValues values = new ContentValues();
                              values.put(MediaStore.Downloads.DISPLAY_NAME, fileName);
                              values.put(MediaStore.Downloads.MIME_TYPE, "application/json");
                              values.put(MediaStore.Downloads.IS_PENDING, 1);
                              Uri itemUri = getContentResolver().insert(
                                      MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                              if (itemUri == null) return false;
                              try (OutputStream out = getContentResolver().openOutputStream(itemUri)) {
                                  if (out == null) return false;
                                  out.write(json.getBytes("UTF-8"));
                              }
                              values.clear();
                              values.put(MediaStore.Downloads.IS_PENDING, 0);
                              getContentResolver().update(itemUri, values, null, null);
                          } else {
                              java.io.File dir = Environment.getExternalStoragePublicDirectory(
                                      Environment.DIRECTORY_DOWNLOADS);
                              if (!dir.exists()) dir.mkdirs();
                              try (java.io.FileOutputStream fos = new java.io.FileOutputStream(
                                      new java.io.File(dir, fileName))) {
                                  fos.write(json.getBytes("UTF-8"));
                              }
                          }
                          runOnUiThread(() -> Toast.makeText(MainActivity.this,
                                  "Saved to Downloads: " + fileName, Toast.LENGTH_LONG).show());
                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  }

                  @JavascriptInterface
                  public boolean hasNotificationPermission() {
                      if (Build.VERSION.SDK_INT >= 33) {
                          return ContextCompat.checkSelfPermission(MainActivity.this,
                                  android.Manifest.permission.POST_NOTIFICATIONS)
                                  == PackageManager.PERMISSION_GRANTED;
                      }
                      return NotificationManagerCompat.from(MainActivity.this).areNotificationsEnabled();
                  }

                  @JavascriptInterface
                  public void requestNotificationPermission() {
                      if (Build.VERSION.SDK_INT >= 33) {
                          runOnUiThread(() -> requestPermissions(
                                  new String[]{android.Manifest.permission.POST_NOTIFICATIONS},
                                  NOTIFICATION_PERMISSION_REQUEST_CODE));
                      }
                  }

                  @JavascriptInterface
                  public boolean scheduleReminderNotification(
                          String id, String title, String body, String triggerAtMillis) {
                      try {
                          long when = Long.parseLong(triggerAtMillis);
                          if (when <= System.currentTimeMillis()) return false;
                          int requestCode = stableRequestCode(id);
                          Intent intent = new Intent(MainActivity.this, ReminderReceiver.class);
                          intent.putExtra("notificationId", requestCode);
                          intent.putExtra("title", title);
                          intent.putExtra("body", body);
                          PendingIntent pendingIntent = PendingIntent.getBroadcast(
                                  MainActivity.this, requestCode, intent,
                                  PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                          AlarmManager alarmManager = (AlarmManager) getSystemService(Context.ALARM_SERVICE);
                          if (alarmManager == null) return false;
                          try {
                              if (Build.VERSION.SDK_INT >= 31 && !alarmManager.canScheduleExactAlarms()) {
                                  alarmManager.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, when, pendingIntent);
                              } else {
                                  alarmManager.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, when, pendingIntent);
                              }
                          } catch (SecurityException se) {
                              alarmManager.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, when, pendingIntent);
                          }
                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  }

                  @JavascriptInterface
                  public boolean cancelReminderNotification(String id) {
                      try {
                          int requestCode = stableRequestCode(id);
                          Intent intent = new Intent(MainActivity.this, ReminderReceiver.class);
                          PendingIntent pendingIntent = PendingIntent.getBroadcast(
                                  MainActivity.this, requestCode, intent,
                                  PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                          AlarmManager alarmManager = (AlarmManager) getSystemService(Context.ALARM_SERVICE);
                          if (alarmManager != null) alarmManager.cancel(pendingIntent);
                          pendingIntent.cancel();
                          NotificationManagerCompat.from(MainActivity.this).cancel(requestCode);
                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  }

                  @JavascriptInterface
                  public boolean isIgnoringBatteryOptimizations() {
                      PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                      if (pm == null) return false;
                      return pm.isIgnoringBatteryOptimizations(getPackageName());
                  }

                  @JavascriptInterface
                  public void requestIgnoreBatteryOptimizations() {
                      try {
                          Intent intent = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                          intent.setData(Uri.parse("package:" + getPackageName()));
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(intent);
                      } catch (Exception e) {
                          // OEM does not support this intent
                      }
                  }

                  private int stableRequestCode(String id) {
                      if (id == null) return 0;
                      return (id.hashCode() & 0x7fffffff) % 1000000000;
                  }
              }

              private void createReminderNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                              REMINDER_CHANNEL_ID, "VaultOne Reminders",
                              NotificationManager.IMPORTANCE_DEFAULT);
                      channel.setDescription("Reminder notifications from VaultOne");
                      NotificationManager manager = getSystemService(NotificationManager.class);
                      if (manager != null) manager.createNotificationChannel(channel);
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.stopLoading();
                      webView.loadUrl("about:blank");
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }
          }
          EOF

      # 19. CREATE REMINDERRECEIVER.JAVA
      - name: Create ReminderReceiver.java
        shell: bash
        run: |
          cat > app/src/main/java/com/vaultone/app/ReminderReceiver.java <<'EOF'
          package com.vaultone.app;

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;

          import androidx.core.app.NotificationCompat;
          import androidx.core.app.NotificationManagerCompat;

          public class ReminderReceiver extends BroadcastReceiver {

              private static final String CHANNEL_ID = "vaultone_reminders";

              @Override
              public void onReceive(Context context, Intent intent) {
                  int notificationId = intent.getIntExtra("notificationId", 0);
                  String title = intent.getStringExtra("title");
                  String body  = intent.getStringExtra("body");
                  if (title == null || title.isEmpty()) title = "VaultOne Reminder";
                  if (body  == null) body = "";

                  ensureChannel(context);

                  NotificationCompat.Builder builder =
                          new NotificationCompat.Builder(context, CHANNEL_ID)
                                  .setSmallIcon(android.R.drawable.ic_popup_reminder)
                                  .setContentTitle(title)
                                  .setContentText(body)
                                  .setStyle(new NotificationCompat.BigTextStyle().bigText(body))
                                  .setPriority(NotificationCompat.PRIORITY_DEFAULT)
                                  .setAutoCancel(true);

                  Intent launchIntent = context.getPackageManager()
                          .getLaunchIntentForPackage(context.getPackageName());
                  if (launchIntent != null) {
                      launchIntent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                      PendingIntent contentIntent = PendingIntent.getActivity(
                              context, notificationId, launchIntent,
                              PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                      builder.setContentIntent(contentIntent);
                  }

                  try {
                      NotificationManagerCompat.from(context).notify(notificationId, builder.build());
                  } catch (SecurityException e) {
                      // POST_NOTIFICATIONS not granted — silently ignore
                  }
              }

              private void ensureChannel(Context context) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationManager manager =
                              (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);
                      if (manager != null && manager.getNotificationChannel(CHANNEL_ID) == null) {
                          NotificationChannel channel = new NotificationChannel(
                                  CHANNEL_ID, "VaultOne Reminders",
                                  NotificationManager.IMPORTANCE_DEFAULT);
                          channel.setDescription("Reminder notifications from VaultOne");
                          manager.createNotificationChannel(channel);
                      }
                  }
              }
          }
          EOF

      # 20. INSPECT GENERATED PROJECT
      - name: Inspect generated Android project
        shell: bash
        run: |
          set -e
          find . -maxdepth 6 -type f \
            \( -name "*.gradle" -o -name "*.xml" -o -name "*.java" \
               -o -name "VaultOne.html" -o -name "gradle.properties" \) \
            -not -path "./.git/*" -print | sort

      # 21. VALIDATE GRADLE PROJECT
      - name: Validate Gradle project
        shell: bash
        run: |
          set -e
          gradle --no-daemon :app:tasks --stacktrace

      # 22. GENERATE GRADLE WRAPPER
      - name: Generate Gradle Wrapper
        shell: bash
        run: |
          set -e
          gradle --no-daemon wrapper \
            --gradle-version "${GRADLE_VERSION}" \
            --distribution-type bin
          chmod +x ./gradlew
          ls -lh ./gradlew ./gradle/wrapper/

      # 23. VERIFY WRAPPER
      - name: Verify Gradle Wrapper
        shell: bash
        run: |
          set -e
          [ -f "./gradlew" ] || { echo "ERROR: gradlew missing."; exit 1; }
          [ -f "./gradle/wrapper/gradle-wrapper.properties" ] || { echo "ERROR: wrapper properties missing."; exit 1; }
          chmod +x ./gradlew
          cat ./gradle/wrapper/gradle-wrapper.properties
          ./gradlew --version

      # 24. CLEAN
      - name: Clean Android project
        shell: bash
        run: ./gradlew --no-daemon clean --stacktrace

      # 25. BUILD DEBUG APK
      - name: Build VaultOne Debug APK
        shell: bash
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      # 26. VERIFY APK
      - name: Verify APK
        shell: bash
        run: |
          set -e
          DEBUG_APK="./app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$DEBUG_APK" ]; then
            echo "ERROR: APK not found at $DEBUG_APK"
            find . -type f -name "*.apk" -not -path "./.git/*" -print || true
            exit 1
          fi
          echo "SUCCESS: APK generated."
          ls -lh "$DEBUG_APK"

      # 27. PREPARE ARTIFACT
      - name: Prepare VaultOne APK
        shell: bash
        run: |
          set -e
          mkdir -p release
          cp "./app/build/outputs/apk/debug/app-debug.apk" "./release/VaultOne.apk"
          ls -lh "./release/VaultOne.apk"

      # 28. UPLOAD APK
      - name: Upload VaultOne APK
        uses: actions/upload-artifact@v4
        with:
          name: VaultOne-APK
          path: release/VaultOne.apk
          if-no-files-found: error

      # 29. UPLOAD BUILD REPORTS
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VaultOne-Build-Reports
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
          if-no-files-found: ignore
