name: Build VaultOne APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.7'
  AGP_VERSION: '8.6.1'
  ANDROID_API: '35'
  BUILD_TOOLS_VERSION: '35.0.0'
  APP_ID: 'com.vaultone.app'
  APP_NAME: 'VaultOne'


jobs:

  build:
    name: Build VaultOne APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. JAVA 17
      # ==========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # ==========================================================
      # 3. SETUP GRADLE 8.7
      # ==========================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # ==========================================================
      # 4. ANDROID SDK
      # ==========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -e

          echo "Accepting Android SDK licenses..."

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          echo "Installing Android SDK components..."

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS_VERSION}"

          echo "Android SDK installation completed."

      # ==========================================================
      # 5. BASIC ENVIRONMENT CHECK
      # ==========================================================
      - name: Check build environment
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILD ENVIRONMENT"
          echo "=========================================="

          echo ""
          echo "Working directory:"
          pwd

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          gradle --version

          echo ""
          echo "Android SDK:"
          echo "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

          echo ""
          echo "Git:"
          git --version

      # ==========================================================
      # 6. FIND VAULTONE.HTML
      #
      # We deliberately do NOT assume it is in a particular
      # nested directory.
      # ==========================================================
      - name: Find VaultOne HTML
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING FOR VAULTONE.HTML"
          echo "=========================================="

          HTML_FILE=""

          # Preferred exact filename
          if [ -f "./VaultOne.html" ]; then
            HTML_FILE="./VaultOne.html"
          else
            HTML_FILE=$(find . \
              -type f \
              -name "VaultOne.html" \
              -not -path "./.git/*" \
              -not -path "./app/build/*" \
              | head -n 1 || true)
          fi

          if [ -z "$HTML_FILE" ]; then
            echo ""
            echo "ERROR: VaultOne.html was not found."
            echo ""
            echo "HTML files currently present in repository:"

            find . \
              -type f \
              \( -iname "*.html" -o -iname "*.htm" \) \
              -not -path "./.git/*" \
              -not -path "./app/build/*" \
              -print || true

            echo ""
            echo "Please make sure the file is named exactly:"
            echo "VaultOne.html"

            exit 1
          fi

          HTML_FILE="${HTML_FILE#./}"

          echo "SUCCESS"
          echo "VaultOne HTML:"
          echo "$HTML_FILE"

          echo "$HTML_FILE" > vaultone-html-path.txt

      # ==========================================================
      # 7. CHECK HTML
      # ==========================================================
      - name: Validate VaultOne HTML
        shell: bash
        run: |
          set -e

          HTML_FILE=$(cat vaultone-html-path.txt)

          echo "Checking:"
          echo "$HTML_FILE"

          if [ ! -f "$HTML_FILE" ]; then
            echo "ERROR: HTML file disappeared."
            exit 1
          fi

          FILE_SIZE=$(wc -c < "$HTML_FILE")

          echo "HTML size: ${FILE_SIZE} bytes"

          if [ "$FILE_SIZE" -lt 100 ]; then
            echo "ERROR: VaultOne.html appears to be empty or invalid."
            exit 1
          fi

          echo ""
          echo "HTML first lines:"
          head -n 10 "$HTML_FILE" || true

      # ==========================================================
      # 8. DETECT POSSIBLE EXTERNAL DEPENDENCIES
      #
      # This does NOT fail the build.
      # It warns us if the supposedly offline application
      # references CDN/network resources.
      # ==========================================================
      - name: Check VaultOne offline dependencies
        shell: bash
        run: |
          set +e

          HTML_FILE=$(cat vaultone-html-path.txt)

          echo "=========================================="
          echo "OFFLINE DEPENDENCY CHECK"
          echo "=========================================="

          EXTERNAL_COUNT=$(grep -Eoi \
            'https?://[^"'"'"' )<>]+' \
            "$HTML_FILE" \
            | sort -u \
            | wc -l)

          if [ "$EXTERNAL_COUNT" -gt 0 ]; then
            echo ""
            echo "WARNING: External URLs were detected:"
            grep -Eoi \
              'https?://[^"'"'"' )<>]+' \
              "$HTML_FILE" \
              | sort -u \
              | head -n 30

            echo ""
            echo "The APK may not work fully offline if these resources"
            echo "are required by VaultOne.html."
          else
            echo "No obvious external URLs detected."
          fi

      # ==========================================================
      # 9. CREATE ANDROID PROJECT
      # ==========================================================
      - name: Create Android project structure
        shell: bash
        run: |
          set -e

          mkdir -p \
            app/src/main/java/com/vaultone/app \
            app/src/main/assets \
            app/src/main/res/values \
            app/src/main/res/mipmap-mdpi \
            app/src/main/res/mipmap-hdpi \
            app/src/main/res/mipmap-xhdpi \
            app/src/main/res/mipmap-xxhdpi \
            app/src/main/res/mipmap-xxxhdpi \
            gradle/wrapper

          echo "Android project directories created."

      # ==========================================================
      # 10A. COPY APP ICON
      # ==========================================================
      - name: Copy app icon
        shell: bash
        run: |
          set -e

          if [ ! -f "VaultOne.png" ]; then
            echo "ERROR: VaultOne.png not found in repo root."
            exit 1
          fi

          # Install imagemagick for resizing
          sudo apt-get install -y imagemagick >/dev/null 2>&1

          convert VaultOne.png -resize 48x48   app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert VaultOne.png -resize 72x72   app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert VaultOne.png -resize 96x96   app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert VaultOne.png -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert VaultOne.png -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          echo "App icons generated."

      # ==========================================================
      # 10. COPY VAULTONE.HTML AND SEED JSON
      # ==========================================================
      - name: Copy VaultOne web application
        shell: bash
        run: |
          set -e

          HTML_FILE=$(cat vaultone-html-path.txt)
          HTML_DIR=$(dirname "$HTML_FILE")

          echo "HTML file:"
          echo "$HTML_FILE"

          echo ""
          echo "HTML directory:"
          echo "$HTML_DIR"

          if [ "$HTML_DIR" = "." ]; then

            cp "./VaultOne.html" \
              "app/src/main/assets/VaultOne.html"

          else

            cp "$HTML_FILE" \
              "app/src/main/assets/VaultOne.html"

            echo ""
            echo "Checking for web resources beside VaultOne.html..."

            find "$HTML_DIR" \
              -maxdepth 2 \
              -type f \
              -not -name "VaultOne.html" \
              -print \
              | head -n 50 || true

          fi

          if [ ! -f "app/src/main/assets/VaultOne.html" ]; then
            echo "ERROR: Failed to copy VaultOne.html."
            exit 1
          fi

          # Copy seed JSON if present
          if [ -f "./vaultone_seed.json" ]; then
            cp "./vaultone_seed.json" "app/src/main/assets/vaultone_seed.json"
            echo "Seed JSON copied to assets."
          else
            echo "WARNING: vaultone_seed.json not found. Skipping seed data."
          fi

          echo ""
          echo "APK assets:"
          ls -lh app/src/main/assets/

      # ==========================================================
      # 11. CREATE SETTINGS.GRADLE
      # ==========================================================
      - name: Create settings.gradle
        shell: bash
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "VaultOne"

          include(":app")
          EOF

      # ==========================================================
      # 12. CREATE ROOT BUILD.GRADLE
      # ==========================================================
      - name: Create root build.gradle
        shell: bash
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

      # ==========================================================
      # 13. CREATE GRADLE.PROPERTIES
      # ==========================================================
      - name: Create gradle.properties
        shell: bash
        run: |
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true

          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

          android.nonTransitiveRClass=true
          android.defaults.buildfeatures.buildconfig=false
          EOF

      # ==========================================================
      # 14. CREATE APP BUILD.GRADLE
      # ==========================================================
      - name: Create app build.gradle
        shell: bash
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.vaultone.app'

              compileSdk 35

              defaultConfig {
                  applicationId 'com.vaultone.app'

                  minSdk 24
                  targetSdk 35

                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {

                  debug {
                      minifyEnabled false
                      shrinkResources false
                  }

                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.16.0'
              implementation 'androidx.core:core:1.13.1'
          }
          EOF

      # ==========================================================
      # 15. CREATE MANIFEST
      # ==========================================================
      - name: Create AndroidManifest.xml
        shell: bash
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <!--
                  Required so VaultOne reminders can post real Android system
                  notifications from a background alarm (Android 13+ requires
                  this to be explicitly granted at runtime).
              -->
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <!--
                  Lets VaultOne schedule reminder alarms that fire at the
                  precise time even while the device is idle (Doze mode).
                  On Android 12+ this may require the user to enable
                  "Alarms & reminders" for VaultOne in system Settings; if not
                  granted, VaultOne automatically falls back to an inexact
                  alarm so reminders still fire (potentially a few minutes
                  later) instead of not firing at all.
              -->
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />

              <application
                  android:allowBackup="false"
                  android:label="VaultOne"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:resizeableActivity="true"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="unspecified">

                      <intent-filter>

                          <action android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

                  <!--
                      Wakes up at the exact time an AlarmManager alarm fires
                      (scheduled by VaultOneAndroidBridge.scheduleReminderNotification)
                      and posts the actual system notification, even if
                      VaultOne itself is closed at that moment.
                  -->
                  <receiver
                      android:name=".ReminderReceiver"
                      android:exported="false" />

              </application>

          </manifest>
          EOF

      # ==========================================================
      # 16. CREATE THEME
      # ==========================================================
      - name: Create Android theme
        shell: bash
        run: |
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:windowActionModeOverlay">
                      true
                  </item>

                  <item name="android:colorAccent">
                      #5B5FEF
                  </item>

                  <item name="android:navigationBarColor">
                      #080D18
                  </item>

                  <item name="android:statusBarColor">
                      #080D18
                  </item>

                  <item name="android:windowLightStatusBar">
                      false
                  </item>

              </style>

          </resources>
          EOF

      # ==========================================================
      # 17. CREATE MAIN ACTIVITY
      # ==========================================================
      - name: Create MainActivity.java
        shell: bash
        run: |
          cat > app/src/main/java/com/vaultone/app/MainActivity.java <<'EOF'
          package com.vaultone.app;

          import android.app.Activity;
          import android.app.AlarmManager;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import androidx.core.app.NotificationManagerCompat;
          import androidx.core.content.ContextCompat;
          import androidx.webkit.WebViewAssetLoader;

          import java.io.OutputStream;

          public class MainActivity extends Activity {

              private WebView webView;

              private WebViewAssetLoader assetLoader;

              /*
               * Required to receive the result of the native file-picker
               * launched for <input type="file"> (used by Import JSON).
               */
              private ValueCallback<Uri[]> filePathCallback;

              private static final int FILE_CHOOSER_REQUEST_CODE = 51426;

              /*
               * Android's WebView does not implement the Web Notifications API
               * that VaultOne.html uses when opened in a normal browser
               * (Notification.requestPermission() / new Notification(...)).
               * This channel + the POST_NOTIFICATIONS permission request below
               * let VaultOneAndroidBridge post real system notifications
               * instead, via AlarmManager + ReminderReceiver.
               */
              private static final String REMINDER_CHANNEL_ID = "vaultone_reminders";
              private static final int NOTIFICATION_PERMISSION_REQUEST_CODE = 48213;

              @Override
              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  createReminderNotificationChannel();

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();

                  /*
                   * VaultOne is an HTML/JavaScript application.
                   */
                  settings.setJavaScriptEnabled(true);

                  /*
                   * Required for localStorage / IndexedDB.
                   */
                  settings.setDomStorageEnabled(true);

                  settings.setDatabaseEnabled(true);

                  /*
                   * Keep the application self-contained.
                   */
                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(false);

                  /*
                   * Disable unnecessary zoom controls.
                   */
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);

                  /*
                   * Load APK assets using WebViewAssetLoader.
                   */
                  assetLoader =
                          new WebViewAssetLoader.Builder()
                                  .addPathHandler(
                                          "/assets/",
                                          new WebViewAssetLoader.AssetsPathHandler(this)
                                  )
                                  .build();

                  webView.setWebViewClient(
                          new WebViewClient() {

                              @Override
                              public WebResourceResponse shouldInterceptRequest(
                                      WebView view,
                                      WebResourceRequest request) {

                                  return assetLoader.shouldInterceptRequest(
                                          request.getUrl()
                                  );
                              }

                              @Override
                              @SuppressWarnings("deprecation")
                              public WebResourceResponse shouldInterceptRequest(
                                      WebView view,
                                      String url) {

                                  return assetLoader.shouldInterceptRequest(
                                          Uri.parse(url)
                                  );
                              }

                              @Override
                              public void onPageFinished(WebView view, String url) {
                                  super.onPageFinished(view, url);

                                  /*
                                   * Inject seed data only AFTER the real page has
                                   * finished loading, so it lands in the correct
                                   * JavaScript document context instead of being
                                   * discarded by navigation.
                                   */
                                  injectSeedData();
                              }
                          }
                  );

                  /*
                   * WebChromeClient is required for:
                   *  - window.confirm() / window.alert() / window.prompt()
                   *    (used throughout VaultOne for delete confirmations,
                   *    "Clear All Data", and PIN changes). Without a
                   *    WebChromeClient, Android WebView silently returns
                   *    false/null for these calls and NOTHING happens.
                   *  - onShowFileChooser(), required for <input type="file">
                   *    (used by "Import JSON") to open the system file picker.
                   */
                  webView.setWebChromeClient(
                          new WebChromeClient() {

                              @Override
                              public boolean onShowFileChooser(
                                      WebView view,
                                      ValueCallback<Uri[]> callback,
                                      FileChooserParams params) {

                                  if (filePathCallback != null) {
                                      filePathCallback.onReceiveValue(null);
                                  }
                                  filePathCallback = callback;

                                  Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                                  intent.addCategory(Intent.CATEGORY_OPENABLE);
                                  intent.setType("application/json");
                                  intent.putExtra(
                                          Intent.EXTRA_MIME_TYPES,
                                          new String[]{"application/json", "text/plain"}
                                  );

                                  try {
                                      startActivityForResult(
                                              Intent.createChooser(intent, "Select VaultOne backup JSON"),
                                              FILE_CHOOSER_REQUEST_CODE
                                      );
                                  } catch (Exception e) {
                                      filePathCallback = null;
                                      return false;
                                  }

                                  return true;
                              }
                          }
                  );

                  /*
                   * JavaScript bridge used by VaultOne's Export flow.
                   * VaultOne.html already looks for window.VaultOneAndroid
                   * — exposing it here lets Export JSON save directly and
                   * synchronously to the device Downloads folder without
                   * relying on blob: URL downloads (which Android WebView
                   * cannot handle without this bridge).
                   */
                  webView.addJavascriptInterface(new VaultOneAndroidBridge(), "VaultOneAndroid");

                  setContentView(webView);

                  /*
                   * VaultOne entry point.
                   */
                          webView.loadUrl(
                          "https://appassets.androidplatform.net/assets/VaultOne.html"
                  );
              }

              private void injectSeedData() {
                  try {
                      java.io.InputStream is = getAssets().open("vaultone_seed.json");
                      byte[] buffer = new byte[is.available()];
                      is.read(buffer);
                      is.close();
                      String json = new String(buffer, "UTF-8")
                              .replace("\\", "\\\\")
                              .replace("'", "\\'");
                      String js = "window.__vaultSeedJSON = '" + json + "';";
                      webView.evaluateJavascript(js, null);
                  } catch (Exception e) {
                      // No seed file — fresh install without seed data
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);

                  if (requestCode != FILE_CHOOSER_REQUEST_CODE) {
                      return;
                  }

                  if (filePathCallback == null) {
                      return;
                  }

                  Uri[] results = null;

                  if (resultCode == Activity.RESULT_OK && data != null && data.getData() != null) {
                      results = new Uri[]{data.getData()};
                  }

                  filePathCallback.onReceiveValue(results);
                  filePathCallback = null;
              }

              /**
               * Minimal native bridge exposed to VaultOne.html as
               * window.VaultOneAndroid. Methods take only primitive
               * String arguments so they can be invoked directly from
               * JavaScript via addJavascriptInterface without any
               * object-marshalling limitations.
               */
              private class VaultOneAndroidBridge {

                  @JavascriptInterface
                  public boolean saveExport(String json, String fileName) {
                      try {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              ContentValues values = new ContentValues();
                              values.put(MediaStore.Downloads.DISPLAY_NAME, fileName);
                              values.put(MediaStore.Downloads.MIME_TYPE, "application/json");
                              values.put(MediaStore.Downloads.IS_PENDING, 1);

                              Uri collection = MediaStore.Downloads.EXTERNAL_CONTENT_URI;
                              Uri itemUri = getContentResolver().insert(collection, values);

                              if (itemUri == null) {
                                  return false;
                              }

                              try (OutputStream out = getContentResolver().openOutputStream(itemUri)) {
                                  if (out == null) {
                                      return false;
                                  }
                                  out.write(json.getBytes("UTF-8"));
                              }

                              values.clear();
                              values.put(MediaStore.Downloads.IS_PENDING, 0);
                              getContentResolver().update(itemUri, values, null, null);
                          } else {
                              java.io.File dir = Environment.getExternalStoragePublicDirectory(
                                      Environment.DIRECTORY_DOWNLOADS
                              );
                              if (!dir.exists()) {
                                  dir.mkdirs();
                              }
                              java.io.File outFile = new java.io.File(dir, fileName);
                              try (java.io.FileOutputStream fos = new java.io.FileOutputStream(outFile)) {
                                  fos.write(json.getBytes("UTF-8"));
                              }
                          }

                          runOnUiThread(() -> Toast.makeText(
                                  MainActivity.this,
                                  "Saved to Downloads: " + fileName,
                                  Toast.LENGTH_LONG
                          ).show());

                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  }

                  /**
                   * Returns whether VaultOne currently has permission to post
                   * system notifications. On Android 12 and below this is
                   * granted by default (notifications are only individually
                   * toggle-able by the user in Settings, which this check also
                   * respects via NotificationManagerCompat). On Android 13+ it
                   * reflects the POST_NOTIFICATIONS runtime permission.
                   */
                  @JavascriptInterface
                  public boolean hasNotificationPermission() {
                      if (Build.VERSION.SDK_INT >= 33) {
                          return ContextCompat.checkSelfPermission(
                                  MainActivity.this,
                                  android.Manifest.permission.POST_NOTIFICATIONS
                          ) == PackageManager.PERMISSION_GRANTED;
                      }
                      return NotificationManagerCompat.from(MainActivity.this).areNotificationsEnabled();
                  }

                  /**
                   * Triggers the native Android "Allow notifications?" system
                   * dialog (Android 13+ only; a no-op on older versions where
                   * notification permission is granted by default). VaultOne.html
                   * calls hasNotificationPermission() shortly afterwards to pick
                   * up the user's decision.
                   */
                  @JavascriptInterface
                  public void requestNotificationPermission() {
                      if (Build.VERSION.SDK_INT >= 33) {
                          runOnUiThread(() -> requestPermissions(
                                  new String[]{android.Manifest.permission.POST_NOTIFICATIONS},
                                  NOTIFICATION_PERMISSION_REQUEST_CODE
                          ));
                      }
                  }

                  /**
                   * Schedules a real OS-level alarm (AlarmManager) that fires
                   * ReminderReceiver at triggerAtMillis, even if VaultOne is
                   * closed or the device is idle at that time -- unlike a JS
                   * setTimeout, which is lost the moment the app is
                   * backgrounded. Calling this again with the same id simply
                   * replaces the previously scheduled alarm (no duplicates).
                   */
                  @JavascriptInterface
                  public boolean scheduleReminderNotification(
                          String id, String title, String body, String triggerAtMillis) {
                      try {
                          long when = Long.parseLong(triggerAtMillis);
                          if (when <= System.currentTimeMillis()) {
                              return false;
                          }

                          int requestCode = stableRequestCode(id);

                          Intent intent = new Intent(MainActivity.this, ReminderReceiver.class);
                          intent.putExtra("notificationId", requestCode);
                          intent.putExtra("title", title);
                          intent.putExtra("body", body);

                          PendingIntent pendingIntent = PendingIntent.getBroadcast(
                                  MainActivity.this,
                                  requestCode,
                                  intent,
                                  PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                          );

                          AlarmManager alarmManager =
                                  (AlarmManager) getSystemService(Context.ALARM_SERVICE);
                          if (alarmManager == null) {
                              return false;
                          }

                          try {
                              if (Build.VERSION.SDK_INT >= 31 && !alarmManager.canScheduleExactAlarms()) {
                                  /*
                                   * "Alarms & reminders" special access was not
                                   * granted -- fall back to an inexact alarm so
                                   * the reminder still fires (possibly a few
                                   * minutes later during the next Doze
                                   * maintenance window) instead of not firing
                                   * at all.
                                   */
                                  alarmManager.setAndAllowWhileIdle(
                                          AlarmManager.RTC_WAKEUP, when, pendingIntent);
                              } else {
                                  alarmManager.setExactAndAllowWhileIdle(
                                          AlarmManager.RTC_WAKEUP, when, pendingIntent);
                              }
                          } catch (SecurityException se) {
                              alarmManager.setAndAllowWhileIdle(
                                      AlarmManager.RTC_WAKEUP, when, pendingIntent);
                          }

                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  }

                  /**
                   * Cancels a previously scheduled reminder alarm, e.g. when
                   * the reminder is marked complete or deleted in VaultOne.
                   */
                  @JavascriptInterface
                  public boolean cancelReminderNotification(String id) {
                      try {
                          int requestCode = stableRequestCode(id);

                          Intent intent = new Intent(MainActivity.this, ReminderReceiver.class);

                          PendingIntent pendingIntent = PendingIntent.getBroadcast(
                                  MainActivity.this,
                                  requestCode,
                                  intent,
                                  PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                          );

                          AlarmManager alarmManager =
                                  (AlarmManager) getSystemService(Context.ALARM_SERVICE);
                          if (alarmManager != null) {
                              alarmManager.cancel(pendingIntent);
                          }
                          pendingIntent.cancel();

                          NotificationManagerCompat.from(MainActivity.this).cancel(requestCode);

                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  }

                  /**
                   * Converts VaultOne's string reminder id into a stable,
                   * positive int -- required by AlarmManager/PendingIntent/
                   * NotificationManager, which all key off int request codes.
                   * The same VaultOne id always maps to the same int, so
                   * re-scheduling or cancelling a reminder targets the correct
                   * previously-created alarm/notification.
                   */
                  private int stableRequestCode(String id) {
                      if (id == null) {
                          return 0;
                      }
                      return (id.hashCode() & 0x7fffffff) % 1000000000;
                  }
              }

              private void createReminderNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {

                      NotificationChannel channel = new NotificationChannel(
                              REMINDER_CHANNEL_ID,
                              "VaultOne Reminders",
                              NotificationManager.IMPORTANCE_DEFAULT
                      );
                      channel.setDescription("Reminder notifications from VaultOne");

                      NotificationManager manager = getSystemService(NotificationManager.class);
                      if (manager != null) {
                          manager.createNotificationChannel(channel);
                      }
                  }
              }

              @Override
              public void onRequestPermissionsResult(
                      int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  /*
                   * No explicit handling needed here -- VaultOne.html re-checks
                   * hasNotificationPermission() itself right after calling
                   * requestNotificationPermission(), so the JS side always
                   * reflects the user's latest decision.
                   */
              }

              @Override
              public void onBackPressed() {

                  if (webView != null && webView.canGoBack()) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {

                  if (webView != null) {

                      webView.stopLoading();
                      webView.loadUrl("about:blank");
                      webView.destroy();

                      webView = null;
                  }

                  super.onDestroy();
              }
          }
          EOF

      # ==========================================================
      # 17B. CREATE REMINDER NOTIFICATION RECEIVER
      #
      # Android's WebView does not implement the Web Notifications API
      # (Notification.requestPermission()/new Notification(...)) that
      # VaultOne.html uses when running in a normal desktop/mobile browser.
      # This receiver is woken up by AlarmManager (scheduled from
      # VaultOneAndroidBridge.scheduleReminderNotification in
      # MainActivity.java) at the exact reminder time -- even if VaultOne
      # itself is closed or the device is idle -- and posts a real Android
      # system notification via NotificationCompat.
      # ==========================================================
      - name: Create ReminderReceiver.java
        shell: bash
        run: |
          cat > app/src/main/java/com/vaultone/app/ReminderReceiver.java <<'EOF'
          package com.vaultone.app;

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;

          import androidx.core.app.NotificationCompat;
          import androidx.core.app.NotificationManagerCompat;

          public class ReminderReceiver extends BroadcastReceiver {

              private static final String CHANNEL_ID = "vaultone_reminders";

              @Override
              public void onReceive(Context context, Intent intent) {

                  int notificationId = intent.getIntExtra("notificationId", 0);
                  String title = intent.getStringExtra("title");
                  String body = intent.getStringExtra("body");

                  if (title == null || title.isEmpty()) {
                      title = "VaultOne Reminder";
                  }
                  if (body == null) {
                      body = "";
                  }

                  ensureChannel(context);

                  NotificationCompat.Builder builder =
                          new NotificationCompat.Builder(context, CHANNEL_ID)
                                  .setSmallIcon(android.R.drawable.ic_popup_reminder)
                                  .setContentTitle(title)
                                  .setContentText(body)
                                  .setStyle(new NotificationCompat.BigTextStyle().bigText(body))
                                  .setPriority(NotificationCompat.PRIORITY_DEFAULT)
                                  .setAutoCancel(true);

                  Intent launchIntent =
                          context.getPackageManager().getLaunchIntentForPackage(context.getPackageName());

                  if (launchIntent != null) {
                      launchIntent.setFlags(
                              Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP
                      );

                      PendingIntent contentIntent = PendingIntent.getActivity(
                              context,
                              notificationId,
                              launchIntent,
                              PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                      );

                      builder.setContentIntent(contentIntent);
                  }

                  try {
                      NotificationManagerCompat.from(context).notify(notificationId, builder.build());
                  } catch (SecurityException e) {
                      /*
                       * POST_NOTIFICATIONS was not granted. VaultOne.html
                       * re-checks permission status (hasNotificationPermission)
                       * the next time the app is opened, so this is silently
                       * ignored here rather than crashing the receiver.
                       */
                  }
              }

              private void ensureChannel(Context context) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {

                      NotificationManager manager =
                              (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);

                      if (manager != null && manager.getNotificationChannel(CHANNEL_ID) == null) {

                          NotificationChannel channel = new NotificationChannel(
                                  CHANNEL_ID,
                                  "VaultOne Reminders",
                                  NotificationManager.IMPORTANCE_DEFAULT
                          );
                          channel.setDescription("Reminder notifications from VaultOne");

                          manager.createNotificationChannel(channel);
                      }
                  }
              }
          }
          EOF

      # ==========================================================
      # 18. INSPECT GENERATED PROJECT
      # ==========================================================
      - name: Inspect generated Android project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "GENERATED PROJECT"
          echo "=========================================="

          find . \
            -maxdepth 6 \
            -type f \
            \( \
              -name "*.gradle" \
              -o -name "*.xml" \
              -o -name "*.java" \
              -o -name "VaultOne.html" \
              -o -name "gradle.properties" \
            \) \
            -not -path "./.git/*" \
            -print \
            | sort

      # ==========================================================
      # 19. VALIDATE GRADLE PROJECT
      # ==========================================================
      - name: Validate Gradle project
        shell: bash
        run: |
          set -e

          echo "Checking Gradle project..."

          gradle --no-daemon \
            :app:tasks \
            --stacktrace

      # ==========================================================
      # 20. GENERATE GRADLE WRAPPER
      #
      # This makes the generated project reproducible.
      # ==========================================================
      - name: Generate Gradle Wrapper
        shell: bash
        run: |
          set -e

          gradle \
            --no-daemon \
            wrapper \
            --gradle-version "${GRADLE_VERSION}" \
            --distribution-type bin

          chmod +x ./gradlew

          echo ""
          echo "Gradle Wrapper generated."

          ls -lh ./gradlew
          ls -lh ./gradle/wrapper/

      # ==========================================================
      # 21. VERIFY WRAPPER
      # ==========================================================
      - name: Verify Gradle Wrapper
        shell: bash
        run: |
          set -e

          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew was not generated."
            exit 1
          fi

          if [ ! -f "./gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "ERROR: gradle-wrapper.properties was not generated."
            exit 1
          fi

          chmod +x ./gradlew

          echo "Wrapper configuration:"
          cat ./gradle/wrapper/gradle-wrapper.properties

          echo ""
          echo "Wrapper Gradle version:"
          ./gradlew --version

      # ==========================================================
      # 22. CLEAN
      # ==========================================================
      - name: Clean Android project
        shell: bash
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            clean \
            --stacktrace

      # ==========================================================
      # 23. BUILD DEBUG APK
      # ==========================================================
      - name: Build VaultOne Debug APK
        shell: bash
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            assembleDebug \
            --stacktrace

      # ==========================================================
      # 24. VERIFY APK
      # ==========================================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING FOR APK"
          echo "=========================================="

          APK_FILES=$(find . \
            -type f \
            -name "*.apk" \
            -not -path "./.git/*" \
            -print)

          echo "$APK_FILES"

          if [ -z "$APK_FILES" ]; then
            echo ""
            echo "ERROR: No APK was generated."
            exit 1
          fi

          APK_COUNT=$(echo "$APK_FILES" | grep -c "\.apk$" || true)

          echo ""
          echo "APK count: $APK_COUNT"

          DEBUG_APK="./app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$DEBUG_APK" ]; then
            echo ""
            echo "ERROR: Expected debug APK was not found:"
            echo "$DEBUG_APK"
            exit 1
          fi

          echo ""
          echo "SUCCESS: VaultOne APK generated."

          ls -lh "$DEBUG_APK"

      # ==========================================================
      # 25. PREPARE RELEASE ARTIFACT
      # ==========================================================
      - name: Prepare VaultOne APK
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp \
            "./app/build/outputs/apk/debug/app-debug.apk" \
            "./release/VaultOne.apk"

          echo "Prepared APK:"
          ls -lh "./release/VaultOne.apk"

      # ==========================================================
      # 26. UPLOAD APK
      # ==========================================================
      - name: Upload VaultOne APK
        uses: actions/upload-artifact@v4
        with:
          name: VaultOne-APK
          path: release/VaultOne.apk
          if-no-files-found: error

      # ==========================================================
      # 27. UPLOAD BUILD REPORTS
      # ==========================================================
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VaultOne-Build-Reports
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
          if-no-files-found: ignore
