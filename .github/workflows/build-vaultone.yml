name: Build VaultOne APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build VaultOne APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout VaultOne source code
      - name: Checkout VaultOne
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Install common Android SDK components
      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      # 5. Verify project structure
      - name: Verify Android project
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Project files:"
          ls -la

          echo ""
          echo "Searching for Gradle wrapper:"
          find . -maxdepth 3 -name "gradlew" -type f -print

      # 6. Make Gradle Wrapper executable
      - name: Prepare Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew was not found in the repository root."
            echo "The Android project must contain a Gradle Wrapper."
            exit 1
          fi

          chmod +x ./gradlew

      # 7. Use the project's Gradle Wrapper
      # Do NOT specify a Gradle version here.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # 8. Check Gradle version
      - name: Check Gradle
        run: |
          ./gradlew --version

      # 9. Clean previous build
      - name: Clean project
        run: |
          ./gradlew clean

      # 10. Build Debug APK
      - name: Build VaultOne Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace

      # 11. Find generated APK
      - name: Locate APK
        run: |
          echo "Searching for generated APK files..."
          find . -type f -name "*.apk" -print

      # 12. Upload APK as GitHub Actions artifact
      - name: Upload VaultOne APK
        uses: actions/upload-artifact@v4
        with:
          name: VaultOne-APK
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # 13. Upload build reports if available
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VaultOne-Build-Reports
          path: |
            **/build/reports/**
          if-no-files-found: ignore
