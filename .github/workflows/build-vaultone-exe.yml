name: Build VaultOne Desktop EXE

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:

  build:
    name: Build VaultOne Windows EXE
    runs-on: windows-latest

    steps:

      # 1. CHECKOUT
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. NODE.JS
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. VALIDATE MODULAR APP FILES
      - name: Validate modular app files
        shell: bash
        run: |
          set -e
          for f in index.html shared.js shared.css \
                    sw.js VaultOne.png \
                    iVault.html iVault.js \
                    FamilyVault.html FamilyVault.js \
                    PasswordVault.html PasswordVault.js; do
            if [ ! -f "$f" ]; then
              echo "ERROR: Required file missing: $f"
              exit 1
            fi
            echo "OK: $f ($(wc -c < "$f") bytes)"
          done

      # 4. CREATE ELECTRON PROJECT STRUCTURE
      - name: Create Electron project structure
        shell: bash
        run: mkdir -p assets build

      # 5. COPY ALL MODULAR APP FILES INTO ASSETS
      - name: Copy VaultOne web application
        shell: bash
        run: |
          set -e
          cp index.html shared.js shared.css \
             sw.js VaultOne.png \
             iVault.html iVault.js \
             FamilyVault.html FamilyVault.js \
             PasswordVault.html PasswordVault.js \
             assets/
          ls -lh assets/

      # 6. PREPARE APP ICON
      - name: Prepare app icon
        shell: bash
        run: |
          set -e
          if [ -f "./VaultOne.png" ]; then
            cp "./VaultOne.png" "assets/icon.png"
          elif [ -f "./assets/icon.png" ]; then
            echo "Using existing assets/icon.png"
          else
            echo "ERROR: VaultOne.png not found in repo root."
            exit 1
          fi
          echo "Icon ready."

      # 8. CREATE package.json
      # electron 33.x — latest stable. 36.x does not exist and will fail npm install.
      # electron-builder 24.13.3 — latest stable.
      - name: Create package.json
        shell: pwsh
        run: |
          $json = @'
          {
            "name": "vaultone-desktop",
            "version": "2.0.0",
            "description": "VaultOne - Offline personal vault desktop app",
            "main": "main.js",
            "private": true,
            "scripts": {
              "start": "electron .",
              "dist": "electron-builder --win --x64"
            },
            "build": {
              "appId": "com.vaultone.desktop",
              "productName": "VaultOne",
              "asar": true,
              "files": [
                "main.js",
                "preload.js",
                "assets/**/*"
              ],
              "directories": {
                "output": "dist"
              },
              "win": {
                "target": [
                  { "target": "portable", "arch": ["x64"] },
                  { "target": "nsis",     "arch": ["x64"] }
                ],
                "icon": "assets/icon.png"
              },
              "portable": {
                "artifactName": "VaultOne-Portable.exe"
              },
              "nsis": {
                "oneClick": false,
                "allowToChangeInstallationDirectory": true,
                "artifactName": "VaultOne-Setup.exe",
                "createDesktopShortcut": true,
                "createStartMenuShortcut": true
              }
            },
            "devDependencies": {
              "electron": "^33.0.0",
              "electron-builder": "^24.13.3"
            }
          }
          '@
          Set-Content -Path "package.json" -Value $json -Encoding UTF8

      # 9. CREATE main.js
      # Fixed: protocol.handle now returns a Response built from fs.readFileSync
      # instead of net.fetch('file://...') which is blocked in sandboxed contexts.
      - name: Create main.js
        shell: pwsh
        run: |
          $js = @'
          const { app, BrowserWindow, protocol, ipcMain, dialog } = require('electron');
          const path = require('path');
          const fs = require('fs');

          const ASSETS_DIR = path.join(__dirname, 'assets');

          /*
           * Register a privileged custom scheme ("app://") BEFORE app is ready.
           * Serves from a standard+secure origin so IndexedDB, crypto.subtle,
           * and all web platform APIs work correctly.
           */
          protocol.registerSchemesAsPrivileged([
            {
              scheme: 'app',
              privileges: {
                standard: true,
                secure: true,
                supportFetchAPI: true,
                corsEnabled: true,
                allowServiceWorkers: true,
                stream: true
              }
            }
          ]);

          function registerAppProtocol() {
            protocol.handle('app', (request) => {
              const url = new URL(request.url);
              const filePath = path.join(ASSETS_DIR, decodeURIComponent(url.pathname));
              try {
                const data = fs.readFileSync(filePath);
                const ext = path.extname(filePath).toLowerCase();
                const mimeTypes = {
                  '.html': 'text/html',
                  '.js':   'application/javascript',
                  '.css':  'text/css',
                  '.json': 'application/json',
                  '.png':  'image/png',
                  '.svg':  'image/svg+xml'
                };
                const mime = mimeTypes[ext] || 'application/octet-stream';
                return new Response(data, { headers: { 'Content-Type': mime } });
              } catch (e) {
                return new Response('Not found', { status: 404 });
              }
            });
          }

          let mainWindow;

          function createWindow() {
            mainWindow = new BrowserWindow({
              width: 1200,
              height: 860,
              minWidth: 380,
              minHeight: 600,
              autoHideMenuBar: true,
              backgroundColor: '#060b16',
              icon: path.join(ASSETS_DIR, 'icon.png'),
              webPreferences: {
                preload: path.join(__dirname, 'preload.js'),
                contextIsolation: true,
                nodeIntegration: false,
                sandbox: true
              }
            });

            mainWindow.setMenuBarVisibility(false);
            mainWindow.loadURL('app://vaultone/index.html');

            mainWindow.on('closed', () => {
              mainWindow = null;
            });
          }

          app.whenReady().then(() => {
            registerAppProtocol();
            createWindow();

            app.on('activate', () => {
              if (BrowserWindow.getAllWindows().length === 0) createWindow();
            });
          });

          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') app.quit();
          });

          /*
           * Native file bridge — saveFile, pickFile, writeFile via IPC.
           * VaultOne.html detects window.VaultOneBridge and uses native
           * dialogs for Export, Import, and Link JSON automatically.
           */
          ipcMain.handle('vaultone:saveFile', async (event, payload) => {
            const win = BrowserWindow.fromWebContents(event.sender);
            const { canceled, filePath } = await dialog.showSaveDialog(win, {
              title: 'Export VaultOne Backup',
              defaultPath: (payload && payload.fileName) || 'VaultOne_Backup.json',
              filters: [{ name: 'JSON', extensions: ['json'] }]
            });
            if (canceled || !filePath) return false;
            fs.writeFileSync(filePath, payload.content, 'utf-8');
            return true;
          });

          ipcMain.handle('vaultone:pickFile', async (event, payload) => {
            const win = BrowserWindow.fromWebContents(event.sender);
            const isLinkFlow = Boolean(payload && payload.persistPermission);
            const { canceled, filePaths } = await dialog.showOpenDialog(win, {
              title: isLinkFlow ? 'Select JSON file to link' : 'Select VaultOne Backup JSON',
              properties: ['openFile'],
              filters: [{ name: 'JSON', extensions: ['json'] }]
            });
            if (canceled || !filePaths || filePaths.length === 0) return false;
            if (isLinkFlow) {
              return { uri: filePaths[0], name: path.basename(filePaths[0]) };
            }
            return { content: fs.readFileSync(filePaths[0], 'utf-8') };
          });

          ipcMain.handle('vaultone:writeFile', async (event, payload) => {
            try {
              fs.writeFileSync(payload.uri, payload.content, 'utf-8');
              return true;
            } catch (e) {
              return false;
            }
          });
          '@
          Set-Content -Path "main.js" -Value $js -Encoding UTF8

      # 10. CREATE preload.js
      - name: Create preload.js
        shell: pwsh
        run: |
          $js = @'
          const { contextBridge, ipcRenderer } = require('electron');

          /*
           * Exposed as window.VaultOneBridge inside the renderer pages.
           * VaultOne's bridge detection looks for this exact global, so Export,
           * Import, and Link JSON work natively with no HTML changes needed.
           */
          contextBridge.exposeInMainWorld('VaultOneBridge', {
            saveFile: (payload) => ipcRenderer.invoke('vaultone:saveFile', payload),
            pickFile: (payload) => ipcRenderer.invoke('vaultone:pickFile', payload),
            writeFile: (payload) => ipcRenderer.invoke('vaultone:writeFile', payload)
          });
          '@
          Set-Content -Path "preload.js" -Value $js -Encoding UTF8

      # 11. VALIDATE GENERATED FILES
      - name: Validate generated Electron files
        shell: bash
        run: |
          set -e
          node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8')); console.log('package.json valid.')"
          node --check main.js
          node --check preload.js

      # 12. INSTALL DEPENDENCIES
      - name: Install dependencies
        shell: bash
        run: npm install

      # 13. BUILD WINDOWS EXE
      - name: Build VaultOne Windows EXE
        shell: bash
        run: npx electron-builder --win --x64

      # 14. VERIFY EXE
      - name: Verify EXE output
        shell: bash
        run: |
          set -e
          EXE_FILES=$(find dist -type f -name "*.exe" -print || true)
          if [ -z "$EXE_FILES" ]; then
            echo "ERROR: No EXE was generated."
            find dist -type f -print || true
            exit 1
          fi
          echo "SUCCESS: VaultOne EXE generated."
          ls -lh dist/*.exe

      # 15. UPLOAD EXE
      - name: Upload VaultOne EXE
        uses: actions/upload-artifact@v4
        with:
          name: VaultOne-Desktop-EXE
          path: |
            dist/VaultOne-Portable.exe
            dist/VaultOne-Setup.exe
          if-no-files-found: error

      # 16. UPLOAD BUILD LOGS
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VaultOne-Desktop-Build-Logs
          path: |
            dist/builder-debug.yml
            dist/builder-effective-config.yaml
          if-no-files-found: ignore
